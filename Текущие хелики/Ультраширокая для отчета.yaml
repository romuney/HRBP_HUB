    title: Обогащаем каналами привлечения
    shebang: gp
    code: "drop table if exists all_employee_channel;\n\nset optimizer=off;\n\ncreate table all_employee_channel as \n\nselect e.*\n    , coalesce(cr.recruitment_type_nm,'-') as recruitmenttype\n    , coalesce(cr.mapping_channel_name,'-') as mapping_channel_name\n    , coalesce(cr.respond_source_nm,'-') as respond_source_nm\n    , coalesce(cr.recruiter_ad_login,'-') as recruiter_ad_login\n    , coalesce(cr.recruiter_group_nm,'-') as recruiter_group_nm\n    , coalesce(cr.recruiter_lvl1_legal_unit_nm,'-') as recruiter_lvl1_legal_unit_nm\n    , coalesce('https://candy.tbank.ru/candidates/' || cr.candidate_id,'-') as candy_link\nfrom mdm_employee_d e\n\nleft join usr_cross_data.candidate_x_employee cr\n    on e.mdm_employee_rk = cr.mdm_employee_rk\n    and e.legal_position_rk =cr.legal_position_rk\n\nwhere 1=1\n\ndistributed by (mdm_employee_rk, business_dt);\n\n\n-- select * from all_employee_channel\n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
    isEnabled: true
  - sid: 019b12c0-c1c6-7357-97f5-56b1a248ea3a
    title: Обогащаем причинами увольнений
    shebang: gp
    code: "drop table if exists all_employee_reason;\n\nset optimizer=off;\n\ncreate table all_employee_reason as \n\nselect e.*\n    , coalesce(fr.dismissal_initiator_code, 'Прочее') as fire_initiative\n    , coalesce(fr.dismissal_reason_group_nm, 'Причина отсутствует') as fire_reason_group\n    , coalesce(fr.dismissal_reason_desc, 'Причина отсутствует') as fire_reason\n    , coalesce(fr.lose_talent_txt, 'Нейтрально') as lose_talent_txt\n\n    , coalesce(fr.hr_dismissal_initiator_code, 'Прочее') as hr_dismissal_initiator_code\n    , coalesce(fr.hr_dismissal_reason_desc, 'Причина отсутствует') as hr_dismissal_reason_desc\n    , coalesce(fr.hr_dismissal_sub_reason_desc, '-') as hr_dismissal_sub_reason_desc\n    , coalesce(fr.hr_dismissal_comment_txt, '-') as hr_dismissal_comment_txt\n\n    , coalesce(fr.head_dismissal_initiator_code, 'Прочее') as head_dismissal_initiator_code\n    , coalesce(fr.head_dismissal_reason_desc, 'Причина отсутствует') as head_dismissal_reason_desc\n    , coalesce(fr.head_dismissal_sub_reason_desc, '-') as head_dismissal_sub_reason_desc\n    , coalesce(fr.head_dismissal_comment_txt, '-') as head_dismissal_comment_txt\n\n    , coalesce(fr.dismissal_clause_nm, '-') as dismissal_clause_nm\n    , coalesce(fr.dismissal_clause_desc || ' ' || fr.dismissal_clause_nm, '-') as dismissal_clause_desc\n    \n    , coalesce(fr.head_target_company_nm, '-') as head_exit_company_info\n    , coalesce(fr.employee_dismissal_reason_desc, '-') as employee_dismissal_reason_desc\n    , rotation_flg\nfrom all_employee_channel e\n\nleft join legal_position_dismissal_reason fr\n    on e.legal_position_rk = fr.legal_position_rk\n    and e.legal_fire_dt = fr.fire_dt\n\nwhere 1=1\n\ndistributed by (mdm_employee_rk, business_dt);\n\n\n-- select * from all_employee_reason\n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
    isEnabled: true
  - sid: 019b12c0-c1c6-735a-88a9-14d8e0542aeb
    title: Обогащаем атрибутом Т-образования
    shebang: gp
    code: "drop table if exists all_employee_education;\n\n--set optimizer=off;\n\ncreate table all_employee_education as \n\nselect e.*\n    , coalesce(case when te.hipo_student_flg = 1 then te.project_nm || ' HiPo' else te.project_nm end, 'Не проходил(а)') as t_education_desc\nfrom all_employee_reason e\n\nleft join prod_v_sse_crossdata.mdm_employee_t_education te\n    on e.mdm_employee_rk = te.mdm_employee_rk\n    and e.business_dt between te.valid_from_dttm and te.valid_to_dttm\n\nwhere 1=1\n\ndistributed by (mdm_employee_rk, business_dt);\n\n-- select * from all_employee_education\n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
    isEnabled: true
  - sid: 019b12c0-c1c6-735d-bf59-f4858c11173a
    title: Обогащаем атрибутами юр юнитов
    shebang: gp
    code: "drop table if exists all_employee_legal_unit;\n\n--set optimizer=off;\n\ncreate table all_employee_legal_unit as \n\nselect e.*\n    , lu.rus_tcr_flg\n    , lu.foreign_tcr_flg\n    , lu.tcr_flg\n    , lu.emp_legal_unit_it_code\n    , lu.code_1c\n    , (business_year_nm % 100) as rus_business_year_nm\n    , 'Q' || business_quarter_nm || ' ' || (business_year_nm % 100)  as rus_business_quarter_nm\n    , (case \n    when business_month_nm=1 then 'янв.' \n    when business_month_nm=2 then 'февр.' \n    when business_month_nm=3 then 'март' \n    when business_month_nm=4 then 'апр.' \n    when business_month_nm=5 then 'май' \n    when business_month_nm=6 then 'июнь' \n    when business_month_nm=7 then 'июль' \n    when business_month_nm=8 then 'авг.' \n    when business_month_nm=9 then 'сент.' \n    when business_month_nm=10 then 'окт.' \n    when business_month_nm=11 then 'нояб.' \n    when business_month_nm=12 then 'дек.' \n  end) || ' '|| (business_year_nm % 100)  as rus_business_month_nm\n--   , case\n--     -- lvl1: Удаленная работа\n--     when e.lvl3_legal_unit_nm ilike '%Департамент%дистанционной%разработки%' then 'Удаленная работа'\n--     when e.lvl2_legal_unit_nm ilike '%Департамент%дистанционной%разработки%' then 'Удаленная работа'\n--     when e.employee_contract_type_desc in ('Дистанционный','Временно дистанционный') then 'Удаленная работа'\n\n--     -- lvl2: СНГ (для указанных стран)\n--     when lu.unit_country_iso_code in ('KAZ', 'BLR', 'ARM', 'UZB') then 'СНГ'\n\n--     -- lvl3: Москва/Регионы по структурным подразделениям\n--     when e.lvl2_legal_unit_nm ilike 'Структурное подразделение%' and e.lvl2_legal_unit_nm not ilike '%москва%' then 'Регионы'\n--     when e.lvl3_legal_unit_nm ilike 'Структурное подразделение%' and e.lvl3_legal_unit_nm not ilike '%москва%' then 'Регионы'\n--     when e.lvl2_legal_unit_nm ilike 'Структурное подразделение%' and e.lvl2_legal_unit_nm ilike '%москва%' then 'Москва'\n--     when e.lvl3_legal_unit_nm ilike 'Структурное подразделение%' and e.lvl3_legal_unit_nm ilike '%москва%' then 'Москва'\n\n--     -- lvl4: Явный город Москва\n--     when e.city_nm is not null and e.city_nm ilike '%Москва%' then 'Москва'\n\n--     -- lvl5: Города офисов (РФ -> Регионы, СНГ -> СНГ)\n--     when e.city_nm is not null and e.city_nm in (\n--         'Владивосток','Воронеж','Екатеринбург','Ижевск','Иннополис','Казань','Калининград',\n--         'Краснодар','Красноярск','Нижний Новгород','Академгородок','Новосибирск','Омск',\n--         'Пермь','Ростов-на-Дону','Рязань','Самара','Санкт-Петербург','Саратов','Сочи',\n--         'Таганрог','Томск','Уфа','Чебоксары','Челябинск','Ярославль'\n--     ) then 'Регионы'\n--     when e.city_nm is not null and e.city_nm in ('Ереван','Брест','Ташкент','Минск','Алматы') then 'СНГ'\n\n--     -- lvl6: По региону/стране\n--     when e.residential_state_nm in ('Москва','Московская Область') then 'Москва'\n--     when country_cd = 'RUS' then 'Регионы'\n--     else '-'\n-- end as location_type\n\nfrom all_employee_education e\n\nleft join legal_unit lu\non e.legal_unit_rk = lu.legal_unit_rk\n\nwhere 1=1\n\ndistributed by (mdm_employee_rk, business_dt);\n\n\n-- select * from all_employee_legal_unit\n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
    isEnabled: true
  - sid: 019b12c0-c1c6-7362-b5e8-537166f2b7a6
    title: Обогащаем группой специализации
    shebang: gp
    code: |-
      drop table if exists all_employee_group_specialization;

      set optimizer=off;

      create table all_employee_group_specialization as

      select e.*
          , coalesce(sg.group_specialization_nm, '-') as group_specialization_nm
          , decode(sg.tgrowth_effective_dt <= e.business_dt, true, 'Да', 'Нет') as tgrowth_flg --флаг специализации сотрудника в Т-Росте
          --, case when sg.tgrowth_effective_dt is not null and sg.tgrowth_effective_dt <= e.business_dt then 1 else 0 end as tgrowth_flg_new
          --, sg.tgrowth_effective_dt
      from all_employee_legal_unit e

      left join specialization_group sg
      on e.emp_specialization_dk = sg.emp_specialization_dk

      where 1=1

      distributed by (mdm_employee_rk, business_dt);

      -- select * from all_employee_group_specialization
      -- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'
    isEnabled: true
  - sid: 019b12c0-c1c6-736a-8ab6-a799d4f8be85
    title: Обогащаем датой последней ротации
    shebang: gp
    code: |-
      drop table if exists all_employee;

      -- set optimizer=off;

      create table all_employee as

      select e.*
          , cr.rotation_dt::varchar(512) as rotation_dt_text
          , coalesce(wt.is_in_wt_bot_segment_flg,'Нет') as is_in_wt_bot_segment_flg

      from all_employee_group_specialization e

      left join prod_v_sse_crossdata.candy_rotation cr
          on e.mdm_employee_rk = cr.mdm_employee_rk
          and cr.last_rotation_flg = 1

      left join usr_cross_pub.welcome_team_newbies_flags wt
          on e.mdm_employee_rk = wt.mdm_employee_rk
          and e.company_hire_dt = wt.company_hire_dt

      where 1=1

      distributed by (mdm_employee_rk, business_dt);

      -- select * from all_employee
      -- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'
    isEnabled: true
  - sid: 019b12c0-c1c6-7371-8992-1d9267ae9475
    title: Проверяем дубли
    shebang: gp
    code: "with pre as (\nselect \n    mdm_employee_rk\n    , business_dt\n    , count(*) as cnt\n    , case when count(*)>1\n    then 0\n    else 1\n    end as div\nfrom all_employee\ngroup by 1,2\nhaving count(*) > 1\n)\nselect\n    1/div as quality_check\nfrom pre"
    isEnabled: true
  - sid: 019b12c0-c1c6-7375-b7cf-16eb34ea607e
    title: Добавляем прошлое и следующие значения
    shebang: gp
    code: "-- drop table if exists all_employee_new;  -- закоментил кавторин 11.02\n-- create table all_employee_new as\n\ndrop table if exists all_employee_new_prev_next;\ncreate table all_employee_new_prev_next as \n\n\nselect e.*\n   \n   --Тест полей для перехода на кросс-фильтры\n   , coalesce(e1.lvl3_mapped_management_unit_rk,'-') as prev_lvl3_mapped_management_unit_rk\n   --Наименования уровней УС - прошлое\n   , coalesce(e1.lvl3_management_unit_nm,'-') as prev_lvl3_management_unit_nm\n   , coalesce(e1.lvl4_management_unit_nm,'-') as prev_lvl4_management_unit_nm\n   , coalesce(e1.lvl5_management_unit_nm,'-') as prev_lvl5_management_unit_nm\n   , coalesce(e1.lvl6_management_unit_nm,'-') as prev_lvl6_management_unit_nm\n   , coalesce(e1.lvl7_management_unit_nm,'-') as prev_lvl7_management_unit_nm\n   , coalesce(e1.lvl8_management_unit_nm,'-') as prev_lvl8_management_unit_nm\n   , coalesce(e1.lvl9_management_unit_nm,'-') as prev_lvl9_management_unit_nm\n   , coalesce(e1.lvl10_management_unit_nm,'-') as prev_lvl10_management_unit_nm\n   , coalesce(e1.lvl11_management_unit_nm,'-') as prev_lvl11_management_unit_nm\n   , coalesce(e1.lvl12_management_unit_nm,'-') as prev_lvl12_management_unit_nm\n    \n   --Наименования уровней УС - следующее\n   , coalesce(e2.lvl3_management_unit_nm,'-') as next_lvl3_management_unit_nm\n   , coalesce(e2.lvl4_management_unit_nm,'-') as next_lvl4_management_unit_nm\n   , coalesce(e2.lvl5_management_unit_nm,'-') as next_lvl5_management_unit_nm\n   , coalesce(e2.lvl6_management_unit_nm,'-') as next_lvl6_management_unit_nm\n   , coalesce(e2.lvl7_management_unit_nm,'-') as next_lvl7_management_unit_nm\n   , coalesce(e2.lvl8_management_unit_nm,'-') as next_lvl8_management_unit_nm\n   , coalesce(e2.lvl9_management_unit_nm,'-') as next_lvl9_management_unit_nm\n   , coalesce(e2.lvl10_management_unit_nm,'-') as next_lvl10_management_unit_nm\n   , coalesce(e2.lvl11_management_unit_nm,'-') as next_lvl11_management_unit_nm\n   , coalesce(e2.lvl12_management_unit_nm,'-') as next_lvl12_management_unit_nm\n\n   --Атрибуты УС - прошлое\n   , coalesce(e1.emp_specialization_oper_code,'-') as prev_emp_specialization_oper_code\n   , coalesce(e1.emp_specialization_it_code,'-' ) as prev_emp_specialization_it_code\n   , coalesce(e1.emp_specialization_desc,'-' ) as prev_emp_specialization_desc\n   , coalesce(e1.emp_stream_desc, '-' ) as prev_emp_stream_desc\n   , coalesce(e1.management_head_nm, '-' ) as prev_management_head_nm\n\n   --Атрибуты УС - следующее\n   , coalesce(e2.emp_specialization_oper_code,'-') as next_emp_specialization_oper_code\n   , coalesce(e2.emp_specialization_it_code,'-' ) as next_emp_specialization_it_code\n   , coalesce(e2.emp_specialization_desc,'-' ) as next_emp_specialization_desc\n   , coalesce(e2.emp_stream_desc, '-' ) as next_emp_stream_desc\n   , coalesce(e2.management_head_nm, '-' ) as next_management_head_nm\n\n   --Наименования уровней ЮС - прошлое\n   , coalesce(e1.lvl1_legal_unit_nm, '-' ) as prev_lvl1_legal_unit_nm\n   , coalesce(e1.lvl2_legal_unit_nm, '-' ) as prev_lvl2_legal_unit_nm\n   , coalesce(e1.lvl3_legal_unit_nm, '-' ) as prev_lvl3_legal_unit_nm\n   , coalesce(e1.lvl4_legal_unit_nm, '-' ) as prev_lvl4_legal_unit_nm\n   , coalesce(e1.lvl5_legal_unit_nm, '-' ) as prev_lvl5_legal_unit_nm\n   , coalesce(e1.lvl6_legal_unit_nm, '-' ) as prev_lvl6_legal_unit_nm\n   , coalesce(e1.lvl7_legal_unit_nm, '-' ) as prev_lvl7_legal_unit_nm\n\n   --Наименования уровней ЮС - следующее\n   , coalesce(e2.lvl1_legal_unit_nm, '-' ) as next_lvl1_legal_unit_nm\n   , coalesce(e2.lvl2_legal_unit_nm, '-' ) as next_lvl2_legal_unit_nm\n   , coalesce(e2.lvl3_legal_unit_nm, '-' ) as next_lvl3_legal_unit_nm\n   , coalesce(e2.lvl4_legal_unit_nm, '-' ) as next_lvl4_legal_unit_nm\n   , coalesce(e2.lvl5_legal_unit_nm, '-' ) as next_lvl5_legal_unit_nm\n   , coalesce(e2.lvl6_legal_unit_nm, '-' ) as next_lvl6_legal_unit_nm\n   , coalesce(e2.lvl7_legal_unit_nm, '-' ) as next_lvl7_legal_unit_nm\n\n   --Атрибуты ЮС - прошлое\n   , coalesce(e1.employment_relation_type_desc, '-' ) as prev_employment_relation_type_desc\n   , coalesce(e1.employee_contract_type_desc, '-' ) as prev_employee_contract_type_desc\n   , coalesce(e1.active_type_nm, '-' ) as prev_active_type_nm\n   , coalesce(e1.legal_employee_flg, 0 ) as prev_legal_employee_flg\n   , coalesce(e1.experience_group_nm, '-' ) as prev_experience_group_nm\n   , coalesce(e1.experience_detail_group_nm, '-' ) as prev_experience_detail_group_nm\n   , coalesce(e1.legal_position_nm, '-' ) as prev_legal_position_nm\n\n   --Атрибуты ЮС - следующее\n   , coalesce(e2.employment_relation_type_desc, '-' ) as next_employment_relation_type_desc\n   , coalesce(e2.employee_contract_type_desc, '-' ) as next_employee_contract_type_desc\n   , coalesce(e2.active_type_nm, '-' ) as next_active_type_nm\n   , coalesce(e2.legal_employee_flg, 0 ) as next_legal_employee_flg\n   , coalesce(e2.experience_group_nm, '-' ) as next_experience_group_nm\n   , coalesce(e2.experience_detail_group_nm, '-' ) as next_experience_detail_group_nm\n   , coalesce(e2.legal_position_nm, '-' ) as next_legal_position_nm\n\n   --Атрибуты ФЛ - прошлое\n   , e1.office_desc as prev_office_desc\n   , e1.residential_state_nm as prev_residential_state_nm\n   , e1.gender_desc as prev_gender_desc\n   , e1.seniority as prev_seniority\n   , e1.grade as prev_grade\n   , e1.management_head_flg as prev_management_head_flg\n\n   --Атрибуты ФЛ - следующее\n   , e2.office_desc as next_office_desc\n   , e2.residential_state_nm as next_residential_state_nm\n   , e2.gender_desc as next_gender_desc\n   , e2.seniority as next_seniority\n   , e2.grade as next_grade\n   , e2.management_head_flg as next_management_head_flg\n \nfrom all_employee e\n\nleft join all_employee e1\non e.mdm_employee_rk = e1.mdm_employee_rk\n   and e.business_dt = (e1.business_dt + interval '1 day')::date\n\nleft join all_employee e2\non e.mdm_employee_rk = e2.mdm_employee_rk\n   and e.business_dt = (e2.business_dt - interval '1 day')::date\n\n-- where e.mdm_employee_rk=153461\n\ndistributed by (mdm_employee_rk, business_dt)\n;"
    isEnabled: true
  - sid: 019c476f-6841-763b-b7dc-e911dfd53885
    title: Обогащаем атрибутами
    shebang: gp
    code: |-
      drop table if exists all_employee_new;
      create table all_employee_new as

      select e.*,
          -- предыдущие и следующие значения
          pn.prev_lvl3_management_unit_nm,
          pn.prev_lvl4_management_unit_nm,
          pn.prev_lvl5_management_unit_nm,
          pn.prev_lvl6_management_unit_nm,
          pn.prev_lvl7_management_unit_nm,
          pn.prev_lvl8_management_unit_nm,
          pn.prev_lvl9_management_unit_nm,
          pn.prev_lvl10_management_unit_nm,
          pn.prev_lvl11_management_unit_nm,
          pn.prev_lvl12_management_unit_nm,
          --
          pn.next_lvl3_management_unit_nm,
          pn.next_lvl4_management_unit_nm,
          pn.next_lvl5_management_unit_nm,
          pn.next_lvl6_management_unit_nm,
          pn.next_lvl7_management_unit_nm,
          pn.next_lvl8_management_unit_nm,
          pn.next_lvl9_management_unit_nm,
          pn.next_lvl10_management_unit_nm,
          pn.next_lvl11_management_unit_nm,
          pn.next_lvl12_management_unit_nm,
          --
          pn.prev_emp_specialization_oper_code,
          pn.prev_emp_specialization_it_code,
          pn.prev_emp_specialization_desc,
          pn.prev_emp_stream_desc,
          pn.prev_management_head_nm,
          --
          pn.next_emp_specialization_oper_code,
          pn.next_emp_specialization_it_code,
          pn.next_emp_specialization_desc,
          pn.next_emp_stream_desc,
          pn.next_management_head_nm,
          --
          pn.prev_lvl1_legal_unit_nm,
          pn.prev_lvl2_legal_unit_nm,
          pn.prev_lvl3_legal_unit_nm,
          pn.prev_lvl4_legal_unit_nm,
          pn.prev_lvl5_legal_unit_nm,
          pn.prev_lvl6_legal_unit_nm,
          pn.prev_lvl7_legal_unit_nm,
          --
          pn.next_lvl1_legal_unit_nm,
          pn.next_lvl2_legal_unit_nm,
          pn.next_lvl3_legal_unit_nm,
          pn.next_lvl4_legal_unit_nm,
          pn.next_lvl5_legal_unit_nm,
          pn.next_lvl6_legal_unit_nm,
          pn.next_lvl7_legal_unit_nm,
          --
          pn.prev_employment_relation_type_desc,
          pn.prev_employee_contract_type_desc,
          pn.prev_active_type_nm,
          pn.prev_legal_employee_flg,
          pn.prev_experience_group_nm,
          pn.prev_experience_detail_group_nm,
          pn.prev_legal_position_nm,
          --
          pn.next_employment_relation_type_desc,
          pn.next_employee_contract_type_desc,
          pn.next_active_type_nm,
          pn.next_legal_employee_flg,
          pn.next_experience_group_nm,
          pn.next_experience_detail_group_nm,
          pn.next_legal_position_nm,
          --
          pn.prev_office_desc,
          pn.prev_residential_state_nm,
          pn.prev_gender_desc,
          pn.prev_seniority,
          pn.prev_grade,
          pn.prev_management_head_flg,
          --
          pn.next_office_desc,
          pn.next_residential_state_nm,
          pn.next_gender_desc,
          pn.next_seniority,
          pn.next_grade,
          pn.next_management_head_flg
      from
          all_employee e
      left join
          all_employee_new_prev_next pn on e.mdm_employee_rk = pn.mdm_employee_rk and e.business_dt = pn.business_dt

      distributed by (mdm_employee_rk, business_dt)
      ;
    isEnabled: true
  - sid: 019b12c0-c1c6-7387-8b3e-54d3b18965c9
    title: События переводов по атрибутам УС
    shebang: gp
    code: "select public.tcs_harmonize_grants('prod_v_sse_crossdata.management_position_attr_chng');\n\ndrop table if exists management_transfer;\ncreate table management_transfer as\n\nselect mt.mdm_employee_rk\n    , mt.change_dt\n    , mt.change_from_lvl3_management_flg as transfer_out_lvl3_management_flg\n    , mt.change_from_lvl4_management_flg as transfer_out_lvl4_management_flg\n    , mt.change_from_lvl5_management_flg as transfer_out_lvl5_management_flg\n    , mt.change_from_lvl6_management_flg as transfer_out_lvl6_management_flg\n    , mt.change_from_lvl7_management_flg as transfer_out_lvl7_management_flg\n    , mt.change_from_lvl8_management_flg as transfer_out_lvl8_management_flg\n    , mt.change_from_lvl9_management_flg as transfer_out_lvl9_management_flg\n    , mt.change_from_lvl10_management_flg as transfer_out_lvl10_management_flg\n    , mt.change_from_lvl11_management_flg as transfer_out_lvl11_management_flg\n    , mt.change_from_lvl12_management_flg as transfer_out_lvl12_management_flg\n\n    , mt.change_to_lvl3_management_unit_nm as next_lvl3_management_unit_nm\n    , mt.change_to_lvl4_management_unit_nm as next_lvl4_management_unit_nm\n    , mt.change_to_lvl5_management_unit_nm as next_lvl5_management_unit_nm\n    , mt.change_to_lvl6_management_unit_nm as next_lvl6_management_unit_nm\n    , mt.change_to_lvl7_management_unit_nm as next_lvl7_management_unit_nm\n    , mt.change_to_lvl8_management_unit_nm as next_lvl8_management_unit_nm\n    , mt.change_to_lvl9_management_unit_nm as next_lvl9_management_unit_nm\n    , mt.change_to_lvl10_management_unit_nm as next_lvl10_management_unit_nm\n    , mt.change_to_lvl11_management_unit_nm as next_lvl11_management_unit_nm\n    , mt.change_to_lvl12_management_unit_nm as next_lvl12_management_unit_nm\n\n\n    , mt.change_to_lvl3_management_flg as transfer_to_lvl3_management_flg\n    , mt.change_to_lvl4_management_flg as transfer_to_lvl4_management_flg\n    , mt.change_to_lvl5_management_flg as transfer_to_lvl5_management_flg\n    , mt.change_to_lvl6_management_flg as transfer_to_lvl6_management_flg \n    , mt.change_to_lvl7_management_flg as transfer_to_lvl7_management_flg\n    , mt.change_to_lvl8_management_flg as transfer_to_lvl8_management_flg \n    , mt.change_to_lvl9_management_flg as transfer_to_lvl9_management_flg\n    , mt.change_to_lvl10_management_flg as transfer_to_lvl10_management_flg \n    , mt.change_to_lvl11_management_flg as transfer_to_lvl11_management_flg\n    , mt.change_to_lvl12_management_flg as transfer_to_lvl12_management_flg\n\n    , mt.change_from_lvl3_management_unit_nm as prev_lvl3_management_unit_nm\n    , mt.change_from_lvl4_management_unit_nm as prev_lvl4_management_unit_nm\n    , mt.change_from_lvl5_management_unit_nm as prev_lvl5_management_unit_nm\n    , mt.change_from_lvl6_management_unit_nm as prev_lvl6_management_unit_nm\n    , mt.change_from_lvl7_management_unit_nm as prev_lvl7_management_unit_nm\n    , mt.change_from_lvl8_management_unit_nm as prev_lvl8_management_unit_nm\n    , mt.change_from_lvl9_management_unit_nm as prev_lvl9_management_unit_nm\n    , mt.change_from_lvl10_management_unit_nm as prev_lvl10_management_unit_nm\n    , mt.change_from_lvl11_management_unit_nm as prev_lvl11_management_unit_nm\n    , mt.change_from_lvl12_management_unit_nm as prev_lvl12_management_unit_nm\n\n    , mt.change_from_hq_flg as transfer_out_hq_flg\n    , mt.change_from_it_flg as transfer_out_it_flg\n    , mt.change_from_specialization_flg as transfer_out_specialization_flg\n    , mt.change_from_stream_flg as transfer_out_stream_flg\n    , mt.change_from_management_head_flg as transfer_out_management_head_flg\n    , mt.change_from_seniority_flg as transfer_out_seniority_flg\n    , mt.change_from_grade_flg as transfer_out_grade_flg\n\n    , mt.change_to_emp_specialization_oper_code as next_emp_specialization_oper_code\n    , mt.change_to_emp_specialization_it_code as next_emp_specialization_it_code\n    , mt.change_to_emp_specialization_desc as next_emp_specialization_desc\n    , mt.change_to_emp_stream_desc as next_emp_stream_desc\n\n    , mt.change_to_seniority as next_seniority\n\n    , mt.change_to_hq_flg as transfer_to_hq_flg\n    , mt.change_to_it_flg as transfer_to_it_flg\n    , mt.change_to_specialization_flg as transfer_to_specialization_flg\n    , mt.change_to_stream_flg as transfer_to_stream_flg\n    , mt.change_to_management_head_flg as transfer_to_management_head_flg\n    , mt.change_to_seniority_flg as transfer_to_seniority_flg\n    , mt.change_to_grade_flg as transfer_to_grade_flg\n\n\n    , mt.change_from_emp_specialization_oper_code as prev_emp_specialization_oper_code\n    , mt.change_from_emp_specialization_it_code as prev_emp_specialization_it_code\n    , mt.change_from_emp_specialization_desc as prev_emp_specialization_desc\n    , mt.change_from_emp_stream_desc as prev_emp_stream_desc\n\n    , mt.change_from_seniority as prev_seniority\n\n     -- Считаем ОБЩИЙ флаг перевода\n    , CASE \n            WHEN mt.change_from_lvl3_management_flg = 1 \n              OR mt.change_from_lvl4_management_flg = 1 \n              OR mt.change_from_lvl5_management_flg = 1 \n              OR mt.change_from_lvl6_management_flg = 1 \n              OR mt.change_from_lvl7_management_flg = 1 \n              OR mt.change_from_lvl8_management_flg = 1 \n              OR mt.change_from_lvl9_management_flg = 1 \n              OR mt.change_from_lvl10_management_flg = 1 \n              OR mt.change_from_lvl11_management_flg = 1 \n              OR mt.change_from_lvl12_management_flg = 1 \n              OR mt.change_from_hq_flg = 1 \n              OR mt.change_from_it_flg = 1 \n              OR mt.change_from_specialization_flg = 1 \n              OR mt.change_from_stream_flg = 1 \n              OR mt.change_from_management_head_flg = 1 \n              OR mt.change_from_seniority_flg = 1 \n              OR mt.change_from_grade_flg = 1\n            THEN 1\n            ELSE 0\n        END as is_transfer_out_management_flg\n\n    -- , w.next_emp_specialization_oper_code\n    -- , w.next_emp_specialization_it_code\n    -- , w.next_emp_specialization_desc\n    -- , w.next_emp_stream_desc\n\nfrom prod_v_sse_crossdata.management_position_attr_chng mt\n\nwhere 1=1\n    and mt.change_dt >= date_trunc('year', current_date - interval '1 day') - interval '3 year'\n\ndistributed by (mdm_employee_rk, change_dt)\n;\n\n"
    isEnabled: true
