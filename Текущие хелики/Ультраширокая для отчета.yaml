title: Ультраширокая для отчета
paragraphs:
  - sid: 019b12c0-c1c6-7212-8625-bda6d8a6e97e
    title: Актуальность источников
    shebang: python_condition
    code: |
      tf.tables_wait([
          'prod_v_emart.mdm_employee_structure_d'
          , 'usr_cross_data.functional_role_d_br'
          , 'prod_v_hrmart.legal_position_dismissal_reason'
          , 'usr_cross_data.regrettable_n_non_regrettable_base'
          , 'prod_v_sse_crossdata.management_position_attr_chng'
          , 'prod_v_sse_crossdata.legal_position_attr_chng'
          , 'prod_v_sse_crossdata.mdm_employee_common_attr_change_d'
          , 'prod_v_sse_crossdata.mdm_employee_t_education'
          , 'prod_v_hrmart.mdm_employee_structure_list_d'
          ], gp_service='cross'
      )
    isEnabled: true
  - sid: 019b12c0-c1c6-7225-8029-d5a73975af0b
    title: Проверка на дубли
    shebang: gp
    code: "with pre as (\nselect \n    business_dt\n    , mdm_employee_rk\n    , count(*) as cnt\n    , case when count(*)>1\n    then 0\n    else 1\n    end as div\nfrom prod_v_emart.mdm_employee_structure_d\ngroup by 1,2\nhaving count(*) > 1\n)\nselect\n    1/div as quality_check\nfrom pre"
    isEnabled: true
  - sid: 019b12c0-c1c6-7228-a2d3-dd4838d594c8
    title: Выдаем права на юзер лабы
    shebang: gp
    code: |+
      select public.tcs_harmonize_grants('usr_cross_data.hr_executive_proteus');
      select public.tcs_harmonize_grants('usr_cross_data.mdm_employee_d_light');
      select public.tcs_harmonize_grants('usr_cross_data.functional_structure_digest');

    isEnabled: true
  - sid: 019b12c0-c1c6-72ef-b7b0-d6f6b88a7c97
    title: Логины руководителей/HR
    shebang: gp
    code: "drop table if exists login;\ncreate table login as\n\nselect e.mdm_employee_rk\n    , e.business_dt\n    , e1.wrk_email_address_txt as head_wrk_email_address_txt\n    , e1.wo_employee_login as head_wo_employee_login\n\nfrom prod_v_emart.mdm_employee_structure_d e\n\nleft join prod_v_emart.mdm_employee l\n    on e.management_head_mdm_employee_rk=l.mdm_employee_rk\n\nleft join prod_v_emart.mdm_employee_structure_d e1\n    on e.management_head_mdm_employee_rk=e1.mdm_employee_rk\n    and e.business_dt=e1.business_dt\n\n\nwhere 1=1\n    and e.business_dt >= date_trunc('year', current_date - interval '1 day') - interval '2 year'\n\ndistributed by (mdm_employee_rk,business_dt);\n\n-- select * from login \n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
    isEnabled: true
  - sid: 019fd708-1e58-77f3-b848-1e15d03bdee7
    title: Сотрудник_х_регHR
    shebang: gp
    code: "drop table if exists mdm_employee_x_reg_hr;\ncreate table mdm_employee_x_reg_hr as\n\nselect mdm_employee_rk\n, valid_from_dttm\n, valid_to_dttm\n, array_agg(login_reg_hr) as login_reg_hr_list\nfrom usr_cross_data.location_hr\nwhere 1=1 \ngroup by 1,2,3\n\n\ndistributed by (mdm_employee_rk, valid_from_dttm, valid_to_dttm );"
    isEnabled: true
  - sid: 019b12c0-c1c6-72f5-971b-f66c3354268b
    title: Готовим КП
    shebang: gp
    code: "drop table if exists functional_array;\n\ncreate table functional_array as \n\nselect mdm_employee_rk\n    , business_dt\n    , string_agg(\n             coalesce(trim(f.lvl1_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl2_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl3_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(replace(f.lvl4_functional_unit_nm,'\\t', '')), '-') ||'<>'||\n             coalesce(trim(f.lvl5_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl6_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl7_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl8_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl9_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl10_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl11_functional_unit_nm),'-')||'<>'||\n             coalesce(trim(f.lvl12_functional_unit_nm),'-')||'<>'||\n             coalesce(f.allocation_prt_norm,0),';') as functional_lvl_all_array\n    , array_agg(f.lvl1_functional_unit_nm) as array_lvl1_functional_unit_nm\n    , array_agg(f.lvl2_functional_unit_nm) as array_lvl2_functional_unit_nm\n    , array_agg(f.lvl2_functional_unit_nm) as array_lvl3_functional_unit_nm\n    --, string_agg(f.functional_unit_rk,';') as array_functional_unit_rk\n    , string_agg(\n             coalesce(f.lvl1_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl2_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl3_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl4_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl5_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl6_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl7_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl8_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl9_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl10_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl11_functional_unit_rk,'-')||';'||\n             coalesce(f.lvl12_functional_unit_rk,'-'),';') as array_functional_unit_rk\nfrom usr_cross_data.functional_role_d_br f \nwhere 1=1\n    and f.business_dt >= date_trunc('year', current_date - interval '1 day') - interval '2 year'\n    --and f.business_dt >= date_trunc('month', current_date - interval '1 day') - interval '3 month'\n    and f.mdm_employee_rk is not null\n\ngroup by mdm_employee_rk, business_dt\n\n-- union all\n\n-- select *\n-- from no_functional\n\ndistributed by (mdm_employee_rk, business_dt);\n\n-- select * from functional_array \n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
    isEnabled: true
  - sid: 019b12c0-c1c6-7301-830a-7dd7ac2f99e6
    title: Оценки ревью
    shebang: gp
    code: "drop table if exists review_mark;\n\ncreate table review_mark as\n\nselect mdm_employee_rk /* дублятся: как починят - убрать можно */\n       , (business_dt + interval '9 month')::date as mark_from_dt\n       , case summary_score\n            when 0 then 'Не соответствует ожиданиям'\n            when 1 then 'Есть на чем поработать'\n            when 2 then 'Хорошо, продолжай в том же духе'\n            when 3 then 'Огонь'\n            when 4 then 'Звезда'\n      end::varchar(512) as summary_score\n       , lead((business_dt - interval '1 day' + interval '9 month')::date, 1, '5999-01-01'::date) over (partition by mdm_employee_rk order by business_dt)::date as mark_to_dt\nfrom prod_v_hrmart.summary_evaluation\nwhere 1=1\n      and summary_score is not null\n      and business_dt >= date_trunc('year', current_date - interval '1 day') - interval '3 year'\n      and valid_to_dttm = '5999-01-01 00:00:00'\n      and deleted_flg=0\n\ndistributed by (mdm_employee_rk);\n\n-- select * from review_mark \n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
    isEnabled: true
  - sid: 019b12c0-c1c6-730f-be61-e6ce44ed7314
    title: Атрибуты юридических юнитов
    shebang: gp
    code: "drop table if exists legal_unit;\n\ncreate table legal_unit as \n\nselect distinct on (lu.legal_unit_rk) lu.legal_unit_rk\n    , lu.rus_tcr_flg\n    , lu.foreign_tcr_flg\n    , case when lu.rus_tcr_flg=1 or lu.foreign_tcr_flg=1 then 1 else 0 end::smallint as tcr_flg\n    , lu.emp_legal_unit_it_code\n    , lu.unit_country_iso_code\n    , code.code_1c\nfrom prod_v_sse_crossdata.legal_unit_metric_d lu \n\nleft join usr_cross_data.code_1c code\n    on lu.legal_unit_rk = code.legal_unit_rk\n\nwhere 1=1\n    --and lu.calendar_dt = current_date - interval '1 day'\n\norder by lu.legal_unit_rk, lu.calendar_dt desc\n\ndistributed by (legal_unit_rk);\n\n"
    isEnabled: true
  - sid: 019b12c0-c1c6-7315-ade0-2aa303894538
    title: Разворачиваем подневную историю по профессиям
    shebang: gp
    code: "drop table if exists mdm_employee_detail_profession;\ncreate table mdm_employee_detail_profession as \n\nselect mdm_employee_rk\n, dp.employee_profession_nm\n, generate_series(mp.valid_from_dttm, least(mp.valid_to_dttm, current_date - interval '1 day'), '1 day')::date as business_dt\nfrom prod_v_dds.mdm_employee_x_profession mp\n\ninner join prod_v_dds_dic.employee_profession dp\n    on mp.profession_dk = dp.employee_profession_code\n    and dp.valid_to_dttm = '5999-01-01'\n    and dp.deleted_flg = 0\n\nwhere 1=1\n    and mp.deleted_flg = 0\n\ndistributed by (mdm_employee_rk, business_dt);\n\n"
    isEnabled: true
  - sid: 019b12c0-c1c6-731a-a339-0da3bbea23df
    title: Собираем массив профессий
    shebang: gp
    code: "drop table if exists mdm_employee_profession;\ncreate table mdm_employee_profession as \n\nselect mdm_employee_rk\n, business_dt\n, string_agg(employee_profession_nm,',') as profession_array_nm\nfrom mdm_employee_detail_profession\nwhere 1=1\n    and business_dt >= date_trunc('year', current_date - interval '1 day') - interval '2 year'\ngroup by mdm_employee_rk\n, business_dt\n\ndistributed by (mdm_employee_rk, business_dt);\n\n-- select * from mdm_employee_profession\n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
    isEnabled: true
  - sid: 019cadb7-b492-77f0-99c5-46fd09b74443
    title: NEW - Собираем массив профессий
    shebang: gp
    code: "drop table if exists mdm_employee_profession_new;\ncreate table mdm_employee_profession_new as \n\nwith pre as (select mdm_employee_rk\n, business_dt\n, emp_specialization_desc as profession_name\nfrom prod_v_emart.mdm_employee_structure_d\nwhere 1=1\n    and business_dt >= date_trunc('year', current_date - interval '1 day') - interval '2 year'\n\nunion all \n\nselect mdm_employee_rk\n, business_dt\n, employee_profession_nm\nfrom mdm_employee_detail_profession)\n\nselect mdm_employee_rk\n, business_dt\n, array_agg(\n        profession_name\n ) as profession_nm_array_new\nfrom pre\ngroup by mdm_employee_rk, business_dt\n\ndistributed by (mdm_employee_rk, business_dt);\n\n"
    isEnabled: true
    color: "#EA58A9"
  - sid: 019b12c0-c1c6-732f-953b-3c9581c669a8
    title: Сотрудники с детьми
    shebang: gp
    code: "drop table if exists mdm_employee_with_children;\ncreate table mdm_employee_with_children as \n\nselect distinct individualid::integer as mdm_employee_rk\n, min(birthdate) over (partition by individualid::integer) as valid_from_dttm\n, '5999-01-01 00:00:00'::date as valid_to_dttm\nfrom prod_v_chrono_peoplehub_masterid.individualchildren_public\nwhere 1=1\n    and isdeleted = 'false' \n    and snils is not null\n    and birthdate is not null"
    isEnabled: true
  - sid: 019b12c0-c1c6-7334-a0a5-a8bcfd0672c0
    title: Группа специализаций
    shebang: gp
    code: |
      drop table if exists specialization_group;
      create table specialization_group as

      select sp.employee_specialization_dk as emp_specialization_dk
          , sc.group_specialization_nm
          , sp.tgrowth_effective_dt

      from prod_v_dds_dic.employee_specialization sp

      inner join prod_v_dds_dic.employee_stream st
          on sp.employee_stream_dk = st.employee_stream_dk
          and st.deleted_flg = 0
          and st.valid_to_dttm = '5999-01-01'

      inner join prod_sse_emp.specialization_x_category sc
          on sp.employee_specialization_desc = sc.specialization_nm
          and st.employee_stream_desc = sc.stream_nm
          and sc.valid_to_dttm = '5999-01-01 00:00:00'
          and sc.deleted_flg = 0
          and sc.ph_flg = 'true'

      where 1=1
          and sp.deleted_flg = 0
          and sp.valid_to_dttm = '5999-01-01'
          and sp.employee_specialization_dk != 391;
    isEnabled: true
  - sid: 019f042f-1beb-7e79-b53a-1d8e781381f2
    title: Данные по причинам увольнений
    shebang: gp
    code: "drop table if exists legal_position_dismissal_reason;\n\ncreate table legal_position_dismissal_reason as\n\nselect l.legal_position_rk\n    , l.mdm_employee_rk\n    , l.fire_dt\n    --итоговая причина\n    , l.dismissal_initiator_code\n    , l.dismissal_reason_group_nm\n    , l.dismissal_reason_desc \n    --причина от HR\n    , l.hr_dismissal_initiator_code\n    , l.hr_dismissal_reason_desc\n    , l.hr_dismissal_sub_reason_desc\n    , l.hr_dismissal_comment_txt\n\n    --причина от руководителя\n    , l.head_dismissal_initiator_code\n    , l.head_dismissal_reason_desc\n    , l.head_dismissal_sub_reason_desc\n    , l.head_dismissal_comment_txt\n    \n    , case \n        when l.lose_talent_flg=1 then 'Сожалеем' \n        when l.lose_talent_flg=0 then 'Нейтрально' \n        else 'Нейтрально' end::varchar(20) as lose_talent_txt\n    , l.head_dismissal_comment_txt as company_dismissal_comment_txt\n    , l.source_system_cd\n    , coalesce(edms.edms_fire_reason, l.employee_dismissal_reason_desc) as employee_dismissal_reason_desc\n    , l.head_target_company_nm\n    --юридические причины увольнения\n    , l.dismissal_clause_nm\n    , l.dismissal_clause_desc\n    , edms.rotation_flg\n\nfrom prod_v_hrmart.legal_position_dismissal_reason l \n\nleft join prod_v_sse.edms_reasons_dismissal edms\n    on l.mdm_employee_rk = edms.mdm_employee_rk\n    and l.fire_dt = edms.fire_dt"
    isEnabled: true
    color: "#EA58A9"
  - sid: 019b12c0-c1c6-733c-9334-2f4f6808eb01
    title: Данные по образованию сотрудников
    shebang: gp
    code: "drop table if exists mdm_employee_main_education_pre;\n\ncreate table mdm_employee_main_education_pre as\n\nselect distinct on (mdm_employee_rk, valid_from_dt)\n       mdm_employee_rk\n     , generate_series(coalesce(create_dttm, valid_from_dttm), least(valid_to_dttm, current_date - interval '1 day'), '1 day')::date as valid_from_dt\n     , '5999-01-01'::date as valid_to_dt\n     , okso\n     , education_level_nm\n     , e.graduation_year\n     , e.education_spec_nm\n     , case \n          when education_level_nm ilike '%Докторантура%' then 'Докторантура'\n          when education_level_nm ilike '%Аспирантура%' then 'Аспирантура'\n          when education_level_nm ilike '%Ординатура%' then 'Ординатура'\n          when education_level_nm ilike '%Адъюнктура%' then 'Адъюнктура'\n          when education_level_nm ilike '%Магистратура%' then 'Магистратура'\n          when education_level_nm ilike '%Специалитет%' then 'Специалитет'\n          when education_level_nm ilike '%Бакалав%' then 'Бакалавриат'\n          when education_level_nm ilike '%Высшее образование%' and  not\n          \n          (education_level_nm ilike '%неоконченное высшее%' \n          or \n          education_level_nm ilike '%неполное высшее%'\n          )\n           then 'Высшее образование'\n          when education_level_nm ilike '%Подготовка кадров высшей категории%' then 'Подготовка кадров высшей категории'\n          when \n                education_level_nm ilike '%неоконченное высшее%'\n                or education_level_nm ilike '%Неполное высшее%'\n                \n          /* and not education_level_nm ilike '%Высшее образование%' */ then 'Неполное высшее образование'\n          when education_level_nm ilike '%профессионал%' then 'Среднее профессиональное'\n          when education_level_nm ilike '%Студент%' then 'Студент'\n          when education_level_nm ilike '%11 класс%' then 'Среднее общее образование (11 класс)'\n          when education_level_nm ilike '%9 класс%' then 'Среднее общее образование (9 класс)'\n          when education_level_nm ilike '%в академическом отпуске%' then 'В академическом отпуске'\n          when education_level_nm ilike '%Послевузовское образование%' then 'Повышение квалификации'\n          else education_level_nm end as education_degree_unique_max\nfrom prod_v_hrmart.mdm_employee_education e\nwhere 1=1\n      and e.deleted_flg = 0\n\norder by e.mdm_employee_rk, valid_from_dt, graduation_year desc\n\ndistributed by (mdm_employee_rk)\n;\n\nselect rollup_history(\n    'mdm_employee_main_education_pre',\n    'mdm_employee_main_education(distribution=mdm_employee_rk)',\n    'mdm_employee_rk'\n)\n;"
    isEnabled: false
  - sid: 01a00fce-ac5f-76a4-9be6-199e734f4809
    title: Copy Данные по образованию сотрудников
    shebang: gp
    code: "drop table if exists mdm_employee_main_education_pre;\n\ncreate table mdm_employee_main_education_pre as\n\nwith renamed as (\n    select\n       mdm_employee_rk\n     , okso\n     , education_level_nm\n     , graduation_year\n     , education_spec_nm\n     , case \n          when education_level_nm ilike '%Докторантура%' then 'Докторантура'\n          when education_level_nm ilike '%Аспирантура%' then 'Аспирантура'\n          when education_level_nm ilike '%Ординатура%' then 'Ординатура'\n          when education_level_nm ilike '%Адъюнктура%' then 'Адъюнктура'\n          when education_level_nm ilike '%Магистратура%' then 'Магистратура'\n          when education_level_nm ilike '%Специалитет%' then 'Специалитет'\n          when education_level_nm ilike '%Бакалав%' then 'Бакалавриат'\n          when education_level_nm ilike '%Высшее образование%' and  not\n          \n          (education_level_nm ilike '%неоконченное высшее%' \n          or \n          education_level_nm ilike '%неполное высшее%'\n          )\n           then 'Высшее образование'\n          when education_level_nm ilike '%Подготовка кадров высшей категории%' then 'Подготовка кадров высшей категории'\n          when \n                education_level_nm ilike '%неоконченное высшее%'\n                or education_level_nm ilike '%Неполное высшее%'\n                \n          /* and not education_level_nm ilike '%Высшее образование%' */ then 'Неполное высшее образование'\n          when education_level_nm ilike '%профессионал%' then 'Среднее профессиональное'\n          when education_level_nm ilike '%Студент%' then 'Студент'\n          when education_level_nm ilike '%11 класс%' then 'Среднее общее образование (11 класс)'\n          when education_level_nm ilike '%9 класс%' then 'Среднее общее образование (9 класс)'\n          when education_level_nm ilike '%в академическом отпуске%' then 'В академическом отпуске'\n          when education_level_nm ilike '%Послевузовское образование%' then 'Повышение квалификации'\n          else education_level_nm \n        end as education_degree_unique_max\n     ,  create_dttm\n     ,  valid_from_dttm\n     ,  valid_to_dttm\nfrom prod_v_hrmart.mdm_employee_education\nwhere 1=1\n      and deleted_flg = 0 \n)\n\nselect distinct on (mdm_employee_rk, valid_from_dt)\n       mdm_employee_rk\n     , generate_series(coalesce(create_dttm, valid_from_dttm), least(valid_to_dttm, current_date - interval '1 day'), '1 day')::date as valid_from_dt\n     , '5999-01-01'::date as valid_to_dt\n     , okso\n     , education_level_nm\n     , graduation_year\n     , education_spec_nm\n     , education_degree_unique_max\nfrom renamed\n\norder by mdm_employee_rk, valid_from_dt, graduation_year desc\n\ndistributed by (mdm_employee_rk)\n;\n\nselect rollup_history(\n    'mdm_employee_main_education_pre',\n    'mdm_employee_main_education(distribution=mdm_employee_rk)',\n    'mdm_employee_rk'\n)\n;"
    isEnabled: true
    color: "#EA58A9"
  - sid: 019aee35-8d60-7742-bc14-f1fe2eb30d83
    title: Забираем данные из ультра-широкой
    shebang: gp
    code: "drop table if exists mdm_employee_d;\ncreate table mdm_employee_d as \n\nselect e.business_dt\n    , date_trunc('month',e.business_dt)::date as business_dt_month\n    , date_part('year',e.business_dt)::integer as business_year_nm\n    , date_part('quarter',e.business_dt)::integer as business_quarter_nm\n    , date_part('month',e.business_dt)::integer as business_month_nm\n    , e.mdm_employee_rk\n    , (e.business_dt + interval '1 day')::date as  business_dt_transfer_out\n    , (e.business_dt - interval '1 day')::date as  prev_business_dt\n    , e.company_hire_dt\n    , e.company_fire_dt\n    , e.company_hire_flg\n    , e.company_fire_flg\n    , e.last_work_experience_period_flg\n    , e.work_experience_day_cnt\n    , (e.work_experience_day_cnt::numeric(23,5)/365)::numeric(23,2) as work_experience_year\n    , coalesce(e.experience_group_nm,'-') as experience_group_nm\n    , e.experience_detail_group_nm\n    , e.last_nm\n    , e.first_nm\n    , e.last_nm || ' ' || e.first_nm as mdm_employee_nm\n    , e.middle_nm\n    , e.full_nm\n    , e.last_eng_nm\n    , e.first_eng_nm\n    , e.middle_eng_nm\n    , e.birth_dt\n    , case\n        when birth_dt between '1925-01-01' and '1944-12-31' then 'молчаливое'\n        when birth_dt between '1945-01-01' and '1967-12-31' then 'бэби-бумеров'  \n        when birth_dt between '1968-01-01' and '1984-12-31' then 'X' \n        when birth_dt between '1985-01-01' and '2000-12-31' then 'Y' \n        when birth_dt between '2001-01-01' and '2011-12-31' then 'Z'\n    else 'Y' \n    end as age_generation_nm\n    , e.age as mdm_employee_age\n    , e.birth_day\n    , e.birth_month\n    , coalesce(e.gender_desc,'Мужчина') as gender_desc\n    -- , e.disability_flg\n    , e.clothes_size_code\n    , coalesce(e.marital_status_desc,'-') as marital_status_desc\n    , e.foreign_flg\n    , e.citizenship_country_desc\n    , coalesce(e.office_desc,'-') as office_desc\n    , e.ad_login\n    , e.wrk_email_address_txt\n    , e.snils\n    , e.inn\n    , e.employee_document_type_desc\n    , e.passport_no\n    , e.passport_issuer_nm\n    , e.passport_div_code\n    , e.passport_issue_dt\n    , e.birth_city_nm\n    --, e.birth_dictrict_nm\n    , e.birth_region_nm\n    , e.birth_country_nm\n    , e.contact_main_phone_no\n    , e.prs_email_address_txt\n    , e.registration_postal_code\n    , e.registration_district_nm\n    , e.registration_city_nm\n    , e.registration_state_nm\n    , e.registration_settlement_nm\n    , e.registration_full_address_txt\n    , e.residential_postal_code\n    , e.residential_district_nm\n    , e.residential_city_nm\n    -- , coalesce(r.state_nm,'-') as residential_state_nm --доработанная витрина SSE_CROSSDATA.EMPLOYEE_RESIDENCE\n    -- , coalesce(r.city_nm,'-') as city_nm\n    --доработанная витрина SSE_CROSSDATA.MDM_EMPLOYEE_RESIDENCE\n    , coalesce(r.region_nm,'-') as residential_state_nm --доработанная витрина SSE_CROSSDATA.EMPLOYEE_RESIDENCE\n    , coalesce(r.city_nm,'-') as city_nm\n    , coalesce(r.macroregion_nm,'-') as macroregion_nm\n    , coalesce(r.group_nm,'-') as location_type\n    , coalesce(r.tcr_exist_flg, 0) as tcr_exist_flg\n\n\n    , r.country_cd\n    , e.doc_city_nm\n    , e.residential_settlement_nm\n    , e.residential_full_address_txt\n    , e.legal_hire_dt\n    , e.legal_fire_dt\n    , e.legal_hire_flg\n    , e.legal_fire_flg\n    , e.legal_position_rk\n    , e.legal_position_id\n    , coalesce(e.legal_position_nm,'-') as legal_position_nm\n    , e.legal_integration_source_system_code\n    , e.legal_head_flg\n    , coalesce(e.employment_relation_type_desc,'-') as employment_relation_type_desc\n    , e.employee_status_desc\n    , e.employment_type_desc\n    , e.legal_unit_rk\n    , e.legal_unit_nm\n    , e.legal_unit_type_desc\n    , e.legal_head_mdm_employee_rk\n    , e.legal_head_last_nm\n    , e.legal_head_first_nm\n    , e.legal_head_middle_nm\n    , e.legal_head_full_nm\n    , e.tsdc_head_mdm_employee_rk\n    , e.tsdc_head_last_nm\n    , e.tsdc_head_first_nm\n    , e.hr_head_mdm_employee_rk\n    , e.hr_head_last_nm\n    , e.hr_head_first_nm\n    , coalesce(e.hr_head_last_nm || ' ' || e.hr_head_first_nm,'-') as hr_head_nm\n    , coalesce(e.lvl1_legal_unit_rk,'-') as lvl1_legal_unit_rk\n    , coalesce(e.lvl1_legal_unit_nm,'-') as lvl1_legal_unit_nm\n    , coalesce(e.lvl2_legal_unit_rk,'-') as lvl2_legal_unit_rk\n    , coalesce(e.lvl2_legal_unit_nm,'-') as lvl2_legal_unit_nm\n    , coalesce(e.lvl3_legal_unit_rk,'-') as lvl3_legal_unit_rk\n    , coalesce(e.lvl3_legal_unit_nm,'-') as lvl3_legal_unit_nm\n    , coalesce(e.lvl4_legal_unit_rk,'-') as lvl4_legal_unit_rk\n    , coalesce(e.lvl4_legal_unit_nm,'-') as lvl4_legal_unit_nm\n    , coalesce(e.lvl5_legal_unit_rk,'-') as lvl5_legal_unit_rk\n    , coalesce(e.lvl5_legal_unit_nm,'-') as lvl5_legal_unit_nm\n    , coalesce(e.lvl6_legal_unit_rk,'-') as lvl6_legal_unit_rk\n    , coalesce(e.lvl6_legal_unit_nm,'-') as lvl6_legal_unit_nm\n    , coalesce(e.lvl7_legal_unit_rk,'-') as lvl7_legal_unit_rk\n    , coalesce(e.lvl7_legal_unit_nm,'-') as lvl7_legal_unit_nm\n    , coalesce(e.probation_flg,0) as probation_flg\n    , probation_dt\n    , coalesce(e.employee_contract_type_desc,'-') as employee_contract_type_desc\n    , e.management_position_rk\n    , e.management_position_id\n    , e.management_position_nm\n    , coalesce(e.emp_stream_desc,'-') as emp_stream_desc\n    , coalesce(trim(e.emp_specialization_desc),'-') as emp_specialization_desc\n    , coalesce(e.emp_specialization_oper_code,'-') as emp_specialization_oper_code\n    , coalesce(e.emp_specialization_it_code,'-') as emp_specialization_it_code\n    , e.emp_specialization_dk\n    , e.emp_stream_dk\n    , coalesce(e.management_head_flg,0) as management_head_flg\n    \n    -- , replace(e.management_unit_nm,'&','and') as management_unit_nm\n    -- , e.management_unit_rk\n    \n    , coalesce(e.mapped_management_unit_nm,'-') as management_unit_nm\n    , e.management_unit_rk\n\n    \n    , e.management_head_mdm_employee_rk\n    , coalesce(e.management_head_last_nm || ' ' || e.management_head_first_nm,'-')::varchar(512) as management_head_nm\n    , e.management_head_last_nm\n    , e.management_head_first_nm\n    , e.management_head_middle_nm\n    , e.management_head_full_nm\n    , e.hrbp_mdm_employee_rk\n    , e.hrbp_last_nm\n    , e.hrbp_first_nm\n    , coalesce(e.hrbp_last_nm || ' ' || e.hrbp_first_nm,'-')::varchar(512) as hrbp_nm\n    , e.hrap_mdm_employee_rk\n    , e.hrap_last_nm\n    , e.hrap_first_nm\n    , coalesce(e.hrap_last_nm || ' ' || e.hrap_first_nm,'-')::varchar(512) as hrap_nm\n    \n    --Раскомментить, когда перейдем на норм нейминги\n    -- , coalesce(e.lvl1_management_unit_rk,'-') as lvl1_management_unit_rk\n    -- , coalesce(e.lvl1_management_unit_nm,'-') as lvl1_management_unit_nm\n    -- , coalesce(e.lvl2_management_unit_rk,'-') as lvl2_management_unit_rk\n    -- , coalesce(e.lvl2_management_unit_nm,'-') as lvl2_management_unit_nm\n    -- , coalesce(e.lvl3_management_unit_rk,'-') as lvl3_management_unit_rk\n    -- , coalesce(e.lvl3_management_unit_nm,'-') as lvl3_management_unit_nm\n    -- , coalesce(e.lvl4_management_unit_rk,'-') as lvl4_management_unit_rk\n    -- , coalesce(e.lvl4_management_unit_nm,'-') as lvl4_management_unit_nm\n    -- , coalesce(e.lvl5_management_unit_rk,'-') as lvl5_management_unit_rk\n    -- , coalesce(e.lvl5_management_unit_nm,'-') as lvl5_management_unit_nm\n    -- , coalesce(e.lvl6_management_unit_rk,'-') as lvl6_management_unit_rk\n    -- , coalesce(e.lvl6_management_unit_nm,'-') as lvl6_management_unit_nm\n    -- , coalesce(e.lvl7_management_unit_rk,'-') as lvl7_management_unit_rk\n    -- , coalesce(e.lvl7_management_unit_nm,'-') as lvl7_management_unit_nm\n    -- , coalesce(e.lvl8_management_unit_rk,'-') as lvl8_management_unit_rk\n    -- , coalesce(e.lvl8_management_unit_nm,'-') as lvl8_management_unit_nm\n    -- , coalesce(e.lvl9_management_unit_rk,'-') as lvl9_management_unit_rk\n    -- , coalesce(e.lvl9_management_unit_nm,'-') as lvl9_management_unit_nm\n    -- , coalesce(e.lvl10_management_unit_rk,'-') as lvl10_management_unit_rk\n    -- , coalesce(e.lvl10_management_unit_nm,'-') as lvl10_management_unit_nm\n    -- , coalesce(e.lvl11_management_unit_rk,'-') as lvl11_management_unit_rk\n    -- , coalesce(e.lvl11_management_unit_nm,'-') as lvl11_management_unit_nm\n    -- , coalesce(e.lvl12_management_unit_rk,'-') as lvl12_management_unit_rk\n    -- , coalesce(e.lvl12_management_unit_nm,'-') as lvl12_management_unit_nm\n    \n    --Костыль, пока не перешли на норм нейминги в Exec и дайджесте\n    , coalesce(e.lvl1_mapped_management_unit_rk,'-') as lvl1_management_unit_rk\n    , coalesce(e.lvl1_mapped_management_unit_nm,'-') as lvl1_management_unit_nm\n    , coalesce(e.lvl2_mapped_management_unit_rk,'-') as lvl2_management_unit_rk\n    , coalesce(e.lvl2_mapped_management_unit_nm,'-') as lvl2_management_unit_nm\n    , coalesce(e.lvl3_mapped_management_unit_rk,'-') as lvl3_management_unit_rk\n    , coalesce(e.lvl3_mapped_management_unit_nm,'-') as lvl3_management_unit_nm\n    , coalesce(e.lvl4_mapped_management_unit_rk,'-') as lvl4_management_unit_rk\n    , coalesce(e.lvl4_mapped_management_unit_nm,'-') as lvl4_management_unit_nm\n    , coalesce(e.lvl5_mapped_management_unit_rk,'-') as lvl5_management_unit_rk\n    , coalesce(e.lvl5_mapped_management_unit_nm,'-') as lvl5_management_unit_nm\n    , coalesce(e.lvl6_mapped_management_unit_rk,'-') as lvl6_management_unit_rk\n    , coalesce(e.lvl6_mapped_management_unit_nm,'-') as lvl6_management_unit_nm\n    , coalesce(e.lvl7_mapped_management_unit_rk,'-') as lvl7_management_unit_rk\n    , coalesce(e.lvl7_mapped_management_unit_nm,'-') as lvl7_management_unit_nm\n    , coalesce(e.lvl8_mapped_management_unit_rk,'-') as lvl8_management_unit_rk\n    , coalesce(e.lvl8_mapped_management_unit_nm,'-') as lvl8_management_unit_nm\n    , coalesce(e.lvl9_mapped_management_unit_rk,'-') as lvl9_management_unit_rk\n    , coalesce(e.lvl9_mapped_management_unit_nm,'-') as lvl9_management_unit_nm\n    , coalesce(e.lvl10_mapped_management_unit_rk,'-') as lvl10_management_unit_rk\n    , coalesce(e.lvl10_mapped_management_unit_nm,'-') as lvl10_management_unit_nm\n    , coalesce(e.lvl11_mapped_management_unit_rk,'-') as lvl11_management_unit_rk\n    , coalesce(e.lvl11_mapped_management_unit_nm,'-') as lvl11_management_unit_nm\n    , coalesce(e.lvl12_mapped_management_unit_rk,'-') as lvl12_management_unit_rk\n    , coalesce(e.lvl12_mapped_management_unit_nm,'-') as lvl12_management_unit_nm\n    , coalesce(e.lvl13_mapped_management_unit_rk,'-') as lvl13_management_unit_rk\n    , coalesce(e.lvl13_mapped_management_unit_nm,'-') as lvl13_management_unit_nm\n    \n    --Структура с маппингом\n    , coalesce(e.mapped_management_unit_nm,'-') as mapped_management_unit_nm\n    , e.mapped_management_unit_rk\n    , coalesce(e.lvl1_mapped_management_unit_rk,'-') as lvl1_mapped_management_unit_rk\n    , coalesce(e.lvl1_mapped_management_unit_nm,'-') as lvl1_mapped_management_unit_nm\n\n    , coalesce(e.lvl2_mapped_management_unit_rk,'-') as lvl2_mapped_management_unit_rk\n    , coalesce(e.lvl2_mapped_management_unit_nm,'-') as lvl2_mapped_management_unit_nm\n\n    , coalesce(e.lvl3_mapped_management_unit_rk,'-') as lvl3_mapped_management_unit_rk\n    , coalesce(e.lvl3_mapped_management_unit_nm,'-') as lvl3_mapped_management_unit_nm\n\n    , coalesce(e.lvl4_mapped_management_unit_rk,'-') as lvl4_mapped_management_unit_rk\n    , coalesce(e.lvl4_mapped_management_unit_nm,'-') as lvl4_mapped_management_unit_nm\n\n    , coalesce(e.lvl5_mapped_management_unit_rk,'-') as lvl5_mapped_management_unit_rk\n    , coalesce(e.lvl5_mapped_management_unit_nm,'-') as lvl5_mapped_management_unit_nm\n\n    , coalesce(e.lvl6_mapped_management_unit_rk,'-') as lvl6_mapped_management_unit_rk\n    , coalesce(e.lvl6_mapped_management_unit_nm,'-') as lvl6_mapped_management_unit_nm\n\n    , coalesce(e.lvl7_mapped_management_unit_rk,'-') as lvl7_mapped_management_unit_rk\n    , coalesce(e.lvl7_mapped_management_unit_nm,'-') as lvl7_mapped_management_unit_nm\n\n    , coalesce(e.lvl8_mapped_management_unit_rk,'-') as lvl8_mapped_management_unit_rk\n    , coalesce(e.lvl8_mapped_management_unit_nm,'-') as lvl8_mapped_management_unit_nm\n\n    , coalesce(e.lvl9_mapped_management_unit_rk,'-') as lvl9_mapped_management_unit_rk\n    , coalesce(e.lvl9_mapped_management_unit_nm,'-') as lvl9_mapped_management_unit_nm\n    \n    , coalesce(e.lvl10_mapped_management_unit_rk,'-') as lvl10_mapped_management_unit_rk\n    , coalesce(e.lvl10_mapped_management_unit_nm,'-') as lvl10_mapped_management_unit_nm\n\n    , coalesce(e.lvl11_mapped_management_unit_rk,'-') as lvl11_mapped_management_unit_rk\n    , coalesce(e.lvl11_mapped_management_unit_nm,'-') as lvl11_mapped_management_unit_nm\n\n    , coalesce(e.lvl12_mapped_management_unit_rk,'-') as lvl12_mapped_management_unit_rk\n    , coalesce(e.lvl12_mapped_management_unit_nm,'-') as lvl12_mapped_management_unit_nm\n\n    , coalesce(e.lvl13_mapped_management_unit_rk,'-') as lvl13_mapped_management_unit_rk\n    , coalesce(e.lvl13_mapped_management_unit_nm,'-') as lvl13_mapped_management_unit_nm\n    \n    , coalesce(e.learning_group_flg,0) as learning_group_flg\n    , e.last_day_flg\n    , e.last_day_of_month_flg\n    , coalesce(e.active_type_nm,'-') as active_type_nm\n    , e.business_hire_dt\n    , e.legal_employee_flg\n    , e.active_employee_flg\n    , e.candidate_transfer_flg as transfer_candidate_flg\n    , e.internal_transfer_flg as transfer_internal_flg\n    , e.employee_main_work_no\n    , pp.party_id\n    , e.seniority\n    , coalesce(e.grade::text, '-') as grade\n    , case when e.grade is not null and e.grade<=20 then 1 else 0 end as v_poljakov_access_flg --кастомный флаг, чтобы на уровне HR Exec выдать доступа Полякову\n    , case when e.business_dt = (date_trunc('quarter', e.business_dt) + interval '3 months - 1 day')::date then 1 else 0 end::smallint as last_day_of_quarter_flg\n    , case when e.business_dt = (date_trunc('year', e.business_dt) + interval '1 year - 1 day')::date then 1 else 0 end::smallint as last_day_of_year_flg\n    , e.last_state_flg\n    , e.employee_main_contract_end_dt\n    , coalesce(e.employee_main_contract_type_nm,'-') as employee_main_contract_type_nm\n    , e.active_hire_dt\n    -- , coalesce(lh.hrap_login,'-') as hrap_login\n    , coalesce(e.hrap_ad_login,'-') as hrap_login\n    , e.management_head_ad_login as head_login\n    , l.head_wrk_email_address_txt\n    , l.head_wo_employee_login\n    , coalesce(e.hrbp_ad_login,'-') as hrbp_login\n    , coalesce(e.hr_head_ad_login,'-') as regional_hr_login\n    , case when e.purchase_flg = 1 then 'Приобретенное' else 'Другое' end as type_create_company --Разметка ЮЛ на базе https://wiki.tcsbank.ru/pages/viewpage.action?pageId=3763756972\n    , e.rb_flg\n    , e.rb_migration_flg\n    , 'https://my.tbank.ru/profile/' || e.mdm_employee_rk as employee_link\n    , e.wo_employee_login\n    , coalesce(rm.summary_score,'-') as summary_score\n    , rt.regrettable_fire_flg\n    , rt.potential_regrettable_flg\n    , rt.potential_non_regrettable_flg\n    , rt.non_regrettable_fire_flg\n    , case \n        when rt.regrettable_fire_flg = 1 then 'Regrettable'\n        when rt.non_regrettable_fire_flg = 1 then 'Non-Regrettable'\n        else 'Прочее'\n    end as performer_fire_type\n    , e.schedule_nm as employee_main_schedule_nm\n    , e.emp_contract_no\n    , e.subordination_lvl_code as subordination_lvl\n    , case \n        when e.emp_specialization_desc is not null and pr.profession_array_nm is not null then (e.emp_specialization_desc || ',' || pr.profession_array_nm)\n        when e.emp_specialization_desc is not null and pr.profession_array_nm is null then e.emp_specialization_desc\n    else pr.profession_array_nm end as profession_array_nm\n    -- , prn.profession_nm_array_new\n    , case when mc.mdm_employee_rk is not null then 'Дети есть' else 'Детей нет' end::varchar(10) as has_children_flg  -- вернуть Кавторин\n    , coalesce(me.education_degree_unique_max, '-') as education_degree_unique_max\n    , coalesce(me.education_spec_nm, '-') as  education_spec_nm\n    \n    , wa.mapped_management_unit_rk_list\n    , wa.main_legal_unit_rk_list as legal_unit_rk_list\n    , wa.mdm_employee_rk_list\n    , wa.functional_unit_rk_list\n    , wa.profession_nm_list as profession_nm_array_new\n    , reg_hr.login_reg_hr_list\n   \nfrom prod_v_emart.mdm_employee_structure_d e\n\nleft join prod_v_hrmart.mdm_employee_structure_list_d wa\n    on e.mdm_employee_rk = wa.mdm_employee_rk\n    and e.business_dt = wa.business_dt\n\nleft join prod_v_sse_crossdata.mdm_employee_residence r\n--prod_v_sse_crossdata.employee_residence r \n    on e.mdm_employee_rk=r.mdm_employee_rk\n    and e.business_dt between r.valid_from_dttm and r.valid_to_dttm\n    and r.deleted_flg=0\n\nleft join  mdm_employee_x_reg_hr reg_hr\n    on e.mdm_employee_rk=reg_hr.mdm_employee_rk\n    and e.business_dt between reg_hr.valid_from_dttm and reg_hr.valid_to_dttm\n\nleft join review_mark rm \n    on rm.mdm_employee_rk = e.mdm_employee_rk\n    and e.business_dt between rm.mark_from_dt and rm.mark_to_dt\n\nleft join login l\n    on e.mdm_employee_rk=l.mdm_employee_rk\n    and e.business_dt = l.business_dt\n\nleft join usr_cross_data.regrettable_n_non_regrettable_base rt\n    on e.mdm_employee_rk = rt.mdm_employee_rk\n    and e.business_dt = rt.business_dt\n\nleft join mdm_employee_profession pr\n    on e.mdm_employee_rk = pr.mdm_employee_rk\n    and e.business_dt = pr.business_dt\n\n-- left join mdm_employee_profession_new prn\n--     on e.mdm_employee_rk = prn.mdm_employee_rk\n--     and e.business_dt = prn.business_dt\n\nleft join mdm_employee_with_children mc\n    on e.mdm_employee_rk = mc.mdm_employee_rk\n    and e.business_dt between mc.valid_from_dttm and mc.valid_to_dttm  -- Вернуть Кавторин\n\nleft join mdm_employee_main_education me\n    on e.mdm_employee_rk = me.mdm_employee_rk\n    and e.business_dt between me.valid_from_dt and me.valid_to_dt\n\nleft join prod_v_emart.mdm_employee_x_person_party pp\n    on e.mdm_employee_rk = pp.mdm_employee_rk\n    and e.business_dt between pp.valid_from_dttm and pp.valid_to_dttm\n    and pp.valid_to_dttm >= '2021-01-01'::timestamp\n    and pp.main_flg = 1\n    and pp.deleted_flg = 0\n    and pp.fire_flg = 0\n\nwhere 1=1\n    and e.business_dt >= date_trunc('year', current_date - interval '1 day') - interval '3 year'\n    --and e.business_dt >= date_trunc('year', current_date - interval '1 day') - interval '20 month'\n\n\ndistributed by (mdm_employee_rk, business_dt);\n\n\n-- select * from mdm_employee_d\n-- Where  mdm_employee_rk = 254374 and business_dt =  '2025-05-18'"
