, '-') as lvl12_functional_unit_rk\n    , coalesce(f.allocation_prt_norm, 0) as allocation_prt_norm\n    , f.business_head_mdm_employee_rk\n    , f.business_head_full_nm\n    , f.technical_head_mdm_employee_rk\n    , f.technical_head_full_nm\n    , f.service_head_mdm_employee_rk\n    , f.service_head_full_nm\n    , f.product_type\n    , f.unit_type_nm\nfrom mdm_employee_d_detail e \n\n-- inner join usr_cross_data.functional_role_d_br f \n\nleft join usr_cross_data.functional_role_d_br f \n    on e.mdm_employee_rk = f.mdm_employee_rk\n    and e.business_dt = f.business_dt\n    \nwhere 1=1\n    and date_trunc('month', e.business_dt) >= (current_date - interval '1 day') - interval '1 month'"
    isEnabled: true
