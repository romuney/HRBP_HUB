  - sid: 019fc6ec-3b39-7df5-bf1f-10f5b1a42ff9
    title: Untitled 19
    shebang: gp
    code: "drop table if exists functional_units_metric_aggerate;\ncreate table functional_units_metric_aggerate as \n\nwith pre as (select m.business_dt\n, m.mdm_employee_rk\n, m.emp_specialization_oper_code\n, m.active_type_nm\n, f.lvl1_functional_unit_nm\n, f.lvl2_functional_unit_nm\n, f.lvl3_functional_unit_nm\n, f.lvl4_functional_unit_nm\n, f.lvl5_functional_unit_nm\n, f.allocation_prt_norm\n, f.allocation_prt\nfrom prod_v_sse_crossdata.mdm_employee_d m\n\nleft join usr_cross_data.functional_role_d_br f \n    on m.mdm_employee_rk = f.mdm_employee_rk\n    and m.business_dt = f.business_dt\n\nwhere 1=1\n    and (m.last_day_of_month_flg = 1 or m.last_day_flg = 1)\n    and m.company_fire_flg = 0\n    and m.business_dt > '2026-01-01')\n\nselect business_dt\n, emp_specialization_oper_code\n, active_type_nm\n, lvl1_functional_unit_nm\n, lvl2_functional_unit_nm\n, lvl3_functional_unit_nm\n, lvl4_functional_unit_nm\n, lvl5_functional_unit_nm\n, count(distinct mdm_employee_rk) as employee_cnt\n, sum(allocation_prt_norm) as allocation_prt_norm\n, sum(allocation_prt) as allocation_prt\nfrom pre\ngroup by 1,2,3,4,5,6,7,8"
    isEnabled: false
