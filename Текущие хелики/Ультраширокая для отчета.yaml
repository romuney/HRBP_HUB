    code: "drop table if exists pre_transfer_functional_lvl11;\n\ncreate table  pre_transfer_functional_lvl11 as \n\nselect f.*\n    ,case when max(f.business_dt) over (partition by f.mdm_employee_rk, f.lvl11_functional_unit_rk) = f.business_dt and f.business_dt != current_date - 1\n            then 1\n     when lead(f.business_dt) over  (partition by f.mdm_employee_rk, f.lvl11_functional_unit_rk order by f.business_dt) != f.business_dt + 1 \n       then 1\n        else 0\n        end as transfer_out_lvl11_fucntional_flg\n    , case when min(f.business_dt) over (partition by f.mdm_employee_rk, f.lvl11_functional_unit_rk) = f.business_dt\n           then 1\n       when lag(f.business_dt) over  (partition by f.mdm_employee_rk, f.lvl11_functional_unit_rk order by f.business_dt) != f.business_dt - 1\n       then 1\n        else 0\n        end as transfer_in_lvl11_fucntional_flg\n\nfrom pre_functional_lvl11 f \n\nwhere 1=1\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
  - sid: 019b12c0-c1c6-7491-a7ae-f96064aeb6b9
    title: Уровень 12 КП - считаем флаги переводов
    shebang: gp
    code: "drop table if exists pre_transfer_functional_lvl12;\n\ncreate table  pre_transfer_functional_lvl12 as \n\nselect f.*\n    ,case when max(f.business_dt) over (partition by f.mdm_employee_rk, f.lvl12_functional_unit_rk) = f.business_dt and f.business_dt != current_date - 1\n            then 1\n     when lead(f.business_dt) over  (partition by f.mdm_employee_rk, f.lvl12_functional_unit_rk order by f.business_dt) != f.business_dt + 1 \n       then 1\n        else 0\n        end as transfer_out_lvl12_fucntional_flg\n    , case when min(f.business_dt) over (partition by f.mdm_employee_rk, f.lvl12_functional_unit_rk) = f.business_dt\n           then 1\n       when lag(f.business_dt) over  (partition by f.mdm_employee_rk, f.lvl12_functional_unit_rk order by f.business_dt) != f.business_dt - 1\n       then 1\n        else 0\n        end as transfer_in_lvl12_fucntional_flg\n\nfrom pre_functional_lvl12 f \n\nwhere 1=1\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
  - sid: 019b12c0-c1c6-7497-8ab3-f7e2545a35d9
    title: Достаем общие периоды дат
    shebang: gp
    code: "drop table if exists pre_business_period;\n\ncreate table  pre_business_period as \n\nselect business_dt, mdm_employee_rk\nfrom employee_transfer_ms_ls\n\nunion\n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl1\nwhere 1=1\nand \n    (\n        transfer_out_lvl1_fucntional_flg = 1 \n    or transfer_in_lvl1_fucntional_flg = 1\n    )\n\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl2\nwhere 1=1\nand \n    (\n        transfer_out_lvl2_fucntional_flg = 1 \n    or transfer_in_lvl2_fucntional_flg = 1\n    )\n\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl3\nwhere 1=1\nand \n    (\n        transfer_in_lvl3_fucntional_flg = 1 \n    or transfer_out_lvl3_fucntional_flg = 1\n    )\n\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl4\nwhere 1=1\nand \n    (\n        transfer_in_lvl4_fucntional_flg = 1 \n    or transfer_out_lvl4_fucntional_flg = 1\n    )\n\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl5\nwhere 1=1\nand \n    (\n        transfer_in_lvl5_fucntional_flg = 1 \n    or transfer_out_lvl5_fucntional_flg = 1\n    )\n\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl6\nwhere 1=1\nand \n    (\n        transfer_in_lvl6_fucntional_flg = 1 \n    or transfer_out_lvl6_fucntional_flg = 1\n    )\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl7\nwhere 1=1\nand \n    (\n        transfer_in_lvl7_fucntional_flg = 1 \n    or transfer_out_lvl7_fucntional_flg = 1\n    )\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl8\nwhere 1=1\nand \n    (\n        transfer_in_lvl8_fucntional_flg = 1 \n    or transfer_out_lvl8_fucntional_flg = 1\n    )\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl9\nwhere 1=1\nand \n    (\n        transfer_in_lvl9_fucntional_flg = 1 \n    or transfer_out_lvl9_fucntional_flg = 1\n    )\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl10\nwhere 1=1\nand \n    (\n        transfer_in_lvl10_fucntional_flg = 1 \n    or transfer_out_lvl10_fucntional_flg = 1\n    )\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl11\nwhere 1=1\nand \n    (\n        transfer_in_lvl11_fucntional_flg = 1 \n    or transfer_out_lvl11_fucntional_flg = 1\n    )\nunion \n\nselect business_dt, mdm_employee_rk\nfrom  pre_transfer_functional_lvl12\nwhere 1=1\nand \n    (\n        transfer_in_lvl12_fucntional_flg = 1 \n    or transfer_out_lvl12_fucntional_flg = 1\n    )\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
  - sid: 019b12c0-c1c6-74a6-9fc6-74b67bed418a
    title: Готовим таблицу по сотрудникам для джоина
    shebang: gp
    code: "drop table if exists pre_join_employee;\n\ncreate table  pre_join_employee as \n\nselect m.*\nfrom pre_business_period e\n\ninner join all_employee_new m\n    on e.business_dt=m.business_dt\n    and e.mdm_employee_rk=m.mdm_employee_rk\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
  - sid: 019b12c0-c1c6-74ac-bf1d-bbb10927ff59
    title: Добавляем переводы
    shebang: gp
    code: "/*  Оптимизация.\n    На этом шаге не джойним functional_array, создаём временную таблицу all_employee_add_flags_pre без этих данных\n    Далее будет обьяснение почему так\n*/\n\ndrop table if exists all_employee_add_flags_pre;\ncreate table all_employee_add_flags_pre as\n\nselect e.*\n    \n    --Уровни УС\n    , coalesce(mt.transfer_out_lvl3_management_flg, 0) as transfer_out_lvl3_management_flg\n    , coalesce(mt.transfer_out_lvl4_management_flg, 0) as transfer_out_lvl4_management_flg\n    , coalesce(mt.transfer_out_lvl5_management_flg, 0) as transfer_out_lvl5_management_flg\n    , coalesce(mt.transfer_out_lvl6_management_flg, 0) as transfer_out_lvl6_management_flg\n    , coalesce(mt.transfer_out_lvl7_management_flg, 0) as transfer_out_lvl7_management_flg\n    , coalesce(mt.transfer_out_lvl8_management_flg, 0) as transfer_out_lvl8_management_flg\n    , coalesce(mt.transfer_out_lvl9_management_flg, 0) as transfer_out_lvl9_management_flg\n    , coalesce(mt.transfer_out_lvl10_management_flg, 0) as transfer_out_lvl10_management_flg\n    , coalesce(mt.transfer_out_lvl11_management_flg, 0) as transfer_out_lvl11_management_flg\n    , coalesce(mt.transfer_out_lvl12_management_flg, 0) as transfer_out_lvl12_management_flg\n    \n    , coalesce(mt.transfer_to_lvl3_management_flg, 0) as transfer_to_lvl3_management_flg\n    , coalesce(mt.transfer_to_lvl4_management_flg, 0) as transfer_to_lvl4_management_flg\n    , coalesce(mt.transfer_to_lvl5_management_flg, 0) as transfer_to_lvl5_management_flg\n    , coalesce(mt.transfer_to_lvl6_management_flg, 0) as transfer_to_lvl6_management_flg\n    , coalesce(mt.transfer_to_lvl7_management_flg, 0) as transfer_to_lvl7_management_flg\n    , coalesce(mt.transfer_to_lvl8_management_flg, 0) as transfer_to_lvl8_management_flg\n    , coalesce(mt.transfer_to_lvl9_management_flg, 0) as transfer_to_lvl9_management_flg\n    , coalesce(mt.transfer_to_lvl10_management_flg, 0) as transfer_to_lvl10_management_flg\n    , coalesce(mt.transfer_to_lvl11_management_flg, 0) as transfer_to_lvl11_management_flg\n    , coalesce(mt.transfer_to_lvl12_management_flg, 0) as transfer_to_lvl12_management_flg\n    \n    -- , coalesce(mt.next_lvl3_management_unit_nm, '-') as next_lvl3_management_unit_nm\n    -- , coalesce(mt.next_lvl4_management_unit_nm, '-') as next_lvl4_management_unit_nm\n    -- , coalesce(mt.next_lvl5_management_unit_nm, '-') as next_lvl5_management_unit_nm\n    -- , coalesce(mt.next_lvl6_management_unit_nm, '-') as next_lvl6_management_unit_nm\n    -- , coalesce(mt.next_lvl7_management_unit_nm, '-') as next_lvl7_management_unit_nm\n    -- , coalesce(mt.next_lvl8_management_unit_nm, '-') as next_lvl8_management_unit_nm\n    -- , coalesce(mt.next_lvl9_management_unit_nm, '-') as next_lvl9_management_unit_nm\n    -- , coalesce(mt.next_lvl10_management_unit_nm, '-') as next_lvl10_management_unit_nm\n    -- , coalesce(mt.next_lvl11_management_unit_nm, '-') as next_lvl11_management_unit_nm\n    -- , coalesce(mt.next_lvl12_management_unit_nm, '-') as next_lvl12_management_unit_nm\n    \n    -- , coalesce(mt.prev_lvl3_management_unit_nm, '-') as prev_lvl3_management_unit_nm\n    -- , coalesce(mt.prev_lvl4_management_unit_nm, '-') as prev_lvl4_management_unit_nm\n    -- , coalesce(mt.prev_lvl5_management_unit_nm, '-') as prev_lvl5_management_unit_nm\n    -- , coalesce(mt.prev_lvl6_management_unit_nm, '-') as prev_lvl6_management_unit_nm\n    -- , coalesce(mt.prev_lvl7_management_unit_nm, '-') as prev_lvl7_management_unit_nm\n    -- , coalesce(mt.prev_lvl8_management_unit_nm, '-') as prev_lvl8_management_unit_nm\n    -- , coalesce(mt.prev_lvl9_management_unit_nm, '-') as prev_lvl9_management_unit_nm\n    -- , coalesce(mt.prev_lvl10_management_unit_nm, '-') as prev_lvl10_management_unit_nm\n    -- , coalesce(mt.prev_lvl11_management_unit_nm, '-') as prev_lvl11_management_unit_nm\n    -- , coalesce(mt.prev_lvl12_management_unit_nm, '-') as prev_lvl12_management_unit_nm\n\n    \n    \n    -- , coalesce(mt.next_emp_specialization_desc, '-') as next_emp_specialization_desc\n    -- , coalesce(mt.next_emp_stream_desc, '-') as next_emp_stream_desc\n    -- , coalesce(mt.next_seniority, '-') as next_seniority\n    \n    \n    \n    -- , coalesce(mt.prev_emp_specialization_desc, '-') as prev_emp_specialization_desc\n    -- , coalesce(mt.prev_emp_stream_desc, '-') as prev_emp_stream_desc\n    -- , coalesce(mt.prev_seniority, '-') as prev_seniority\n    \n    \n    --Покраска\n    , coalesce(mt.transfer_out_hq_flg, 0) as transfer_out_hq_flg\n    , coalesce(mt.transfer_to_hq_flg, 0) as transfer_to_hq_flg\n    -- , coalesce(mt.next_emp_specialization_oper_code, '-') as next_emp_specialization_oper_code\n    -- , coalesce(mt.prev_emp_specialization_oper_code, '-') as prev_emp_specialization_oper_code\n\n    --Флаг ИТ\n    , coalesce(mt.transfer_out_it_flg, 0) as transfer_out_it_flg\n    , coalesce(mt.transfer_to_it_flg, 0) as transfer_to_it_flg\n    -- , coalesce(mt.next_emp_specialization_it_code, '-') as next_emp_specialization_it_code\n    -- , coalesce(mt.prev_emp_specialization_it_code, '-') as prev_emp_specialization_it_code\n    \n    --Тип численности\n    , coalesce(ht.transfer_out_active_type_flg, 0) as transfer_out_active_type_flg\n    , coalesce(ht.transfer_to_active_type_flg, 0) as transfer_to_active_type_flg\n    \n    --Специализация\n    , coalesce(mt.transfer_out_specialization_flg, 0) as transfer_out_specialization_flg\n    , coalesce(mt.transfer_to_specialization_flg, 0) as transfer_to_specialization_flg\n    , coalesce(mt.transfer_out_stream_flg, 0) as transfer_out_stream_flg\n    , coalesce(mt.transfer_to_stream_flg, 0) as transfer_to_stream_flg\n    --, (case when w.prev_active_type_nm = 'Кандидат' and e.active_type_nm <> 'Кандидат' then 1 else 0 end)::smallint as transfer_to_business_hire_flg\n\n    --Уровни ЮС\n    , coalesce(lt.transfer_out_lvl1_legal_flg, 0) as transfer_out_lvl1_legal_flg\n    , coalesce(lt.transfer_out_lvl2_legal_flg, 0) as transfer_out_lvl2_legal_flg\n    , coalesce(lt.transfer_out_lvl3_legal_flg, 0) as transfer_out_lvl3_legal_flg\n    , coalesce(lt.transfer_out_lvl4_legal_flg, 0) as transfer_out_lvl4_legal_flg\n    , coalesce(lt.transfer_out_lvl5_legal_flg, 0) as transfer_out_lvl5_legal_flg\n    , coalesce(lt.transfer_out_lvl6_legal_flg, 0) as transfer_out_lvl6_legal_flg\n    , coalesce(lt.transfer_out_lvl7_legal_flg, 0) as transfer_out_lvl7_legal_flg\n    \n    , coalesce(lt.transfer_to_lvl1_legal_flg, 0) as transfer_to_lvl1_legal_flg\n    , coalesce(lt.transfer_to_lvl2_legal_flg, 0) as transfer_to_lvl2_legal_flg\n    , coalesce(lt.transfer_to_lvl3_legal_flg, 0) as transfer_to_lvl3_legal_flg\n    , coalesce(lt.transfer_to_lvl4_legal_flg, 0) as transfer_to_lvl4_legal_flg\n    , coalesce(lt.transfer_to_lvl5_legal_flg, 0) as transfer_to_lvl5_legal_flg\n    , coalesce(lt.transfer_to_lvl6_legal_flg, 0) as transfer_to_lvl6_legal_flg\n    , coalesce(lt.transfer_to_lvl7_legal_flg, 0) as transfer_to_lvl7_legal_flg\n\n    -- , coalesce(lt.next_lvl1_legal_unit_nm, '-' ) as next_lvl1_legal_unit_nm\n    -- , coalesce(lt.next_lvl2_legal_unit_nm, '-' ) as next_lvl2_legal_unit_nm\n    -- , coalesce(lt.next_lvl3_legal_unit_nm, '-' ) as next_lvl3_legal_unit_nm\n    -- , coalesce(lt.next_lvl4_legal_unit_nm, '-' ) as next_lvl4_legal_unit_nm\n    -- , coalesce(lt.next_lvl5_legal_unit_nm, '-' ) as next_lvl5_legal_unit_nm\n    -- , coalesce(lt.next_lvl6_legal_unit_nm, '-' ) as next_lvl6_legal_unit_nm\n    -- , coalesce(lt.next_lvl7_legal_unit_nm, '-' ) as next_lvl7_legal_unit_nm\n\n    -- , coalesce(lt.prev_lvl1_legal_unit_nm, '-' ) as prev_lvl1_legal_unit_nm\n    -- , coalesce(lt.prev_lvl2_legal_unit_nm, '-' ) as prev_lvl2_legal_unit_nm\n    -- , coalesce(lt.prev_lvl3_legal_unit_nm, '-' ) as prev_lvl3_legal_unit_nm\n    -- , coalesce(lt.prev_lvl4_legal_unit_nm, '-' ) as prev_lvl4_legal_unit_nm\n    -- , coalesce(lt.prev_lvl5_legal_unit_nm, '-' ) as prev_lvl5_legal_unit_nm\n    -- , coalesce(lt.prev_lvl6_legal_unit_nm, '-' ) as prev_lvl6_legal_unit_nm\n    -- , coalesce(lt.prev_lvl7_legal_unit_nm, '-' ) as prev_lvl7_legal_unit_nm\n\n    --Атрибуты ЮС\n    , coalesce(lt.transfer_out_employment_relation_type_flg, 0) as transfer_out_employment_relation_type_flg\n    , coalesce(lt.transfer_to_employment_relation_type_flg, 0) as transfer_to_employment_relation_type_flg\n    , coalesce(lt.transfer_out_employee_contract_type_flg, 0) as transfer_out_employee_contract_type_flg\n    , coalesce(lt.transfer_to_employee_contract_type_flg, 0) as transfer_to_employee_contract_type_flg\n    \n    , coalesce(lt.transfer_out_legal_position_flg, 0) as transfer_out_legal_position_flg\n    , coalesce(lt.transfer_to_legal_position_flg , 0) as transfer_to_legal_position_flg\n    \n    , coalesce(ht.transfer_out_legal_employee_flg, 0) as transfer_out_legal_employee_flg\n    , coalesce(ht.transfer_to_legal_employee_flg, 0) as transfer_to_legal_employee_flg\n\n    -- , coalesce(lt.next_employment_relation_type_desc, '-' ) as next_employment_relation_type_desc\n    -- , coalesce(lt.next_employee_contract_type_desc, '-' ) as next_employee_contract_type_desc\n    -- , coalesce(lt.next_legal_position_nm, '-' ) as next_legal_position_nm\n\n    -- , coalesce(lt.prev_employment_relation_type_desc, '-' ) as prev_employment_relation_type_desc\n    -- , coalesce(lt.prev_employee_contract_type_desc, '-' ) as prev_employee_contract_type_desc\n    -- , coalesce(lt.prev_legal_position_nm, '-' ) as prev_legal_position_nm\n    \n    --Остальные атрибуты\n    , coalesce(mt.transfer_out_management_head_flg, 0) as transfer_out_management_head_flg\n    , coalesce(mt.transfer_to_management_head_flg, 0) as transfer_to_management_head_flg    \n    , coalesce(ht.transfer_out_office_flg, 0) as transfer_out_office_flg\n    , coalesce(ht.transfer_to_office_flg, 0) as transfer_to_office_flg\n    , coalesce(ht.transfer_out_residential_state_flg, 0) as transfer_out_residential_state_flg\n    , coalesce(ht.transfer_to_residential_state_flg, 0) as transfer_to_residential_state_flg \n    , coalesce(mt.transfer_out_seniority_flg, 0) as transfer_out_seniority_flg\n    , coalesce(mt.transfer_to_seniority_flg, 0) as transfer_to_seniority_flg  \n    , coalesce(mt.transfer_out_grade_flg, 0) as transfer_out_grade_flg\n    , coalesce(mt.transfer_to_grade_flg, 0) as transfer_to_grade_flg  \n    , coalesce(ht.transfer_out_gender_desc_flg, 0) as transfer_out_gender_desc_flg\n    , coalesce(ht.transfer_to_gender_desc_flg, 0) as transfer_to_gender_desc_flg       \n    --Стаж\n    , coalesce(ht.transfer_out_experience_group_flg, 0) as transfer_out_experience_group_flg\n    , coalesce(ht.transfer_to_experience_group_flg, 0) as transfer_to_experience_group_flg\n    , coalesce(ht.transfer_out_experience_detail_group_flg, 0) as transfer_out_experience_detail_group_flg\n    , coalesce(ht.transfer_to_experience_detail_group_flg, 0) as transfer_to_experience_detail_group_flg \n\n    -- , coalesce(ht.prev_active_type_nm, '-' ) as prev_active_type_nm\n    -- , coalesce(ht.prev_legal_employee_flg, 0) as prev_legal_employee_flg\n    -- , coalesce(ht.prev_experience_group_nm, '-' ) as prev_experience_group_nm\n    -- , coalesce(ht.prev_experience_detail_group_nm, '-' ) as prev_experience_detail_group_nm\n\n    -- , coalesce(ht.next_active_type_nm, '-' ) as next_active_type_nm\n    -- , coalesce(ht.next_legal_employee_flg, 0) as next_legal_employee_flg\n    -- , coalesce(ht.next_experience_group_nm, '-' ) as next_experience_group_nm\n    -- , coalesce(ht.next_experience_detail_group_nm, '-' ) as next_experience_detail_group_nm\n\n    -- , coalesce(ht.prev_office_desc, '-' ) as prev_office_desc\n    -- , coalesce(ht.prev_residential_state_nm, '-' ) as prev_residential_state_nm\n    -- , coalesce(ht.prev_gender_desc, '-' ) as prev_gender_desc\n\n    -- , coalesce(ht.next_office_desc, '-' ) as next_office_desc\n    -- , coalesce(ht.next_residential_state_nm, '-' ) as next_residential_state_nm\n    -- , coalesce(ht.next_gender_desc, '-' ) as next_gender_desc\n                    \n    , case  when last_day_flg=1 then 1 else last_day_of_month_flg end as last_day_of_month_flg_new\n    , case  when last_day_flg=1 then 1 else last_day_of_quarter_flg end as last_day_of_quarter_flg_new\n    , case  when last_day_flg=1 then 1 else last_day_of_year_flg end as last_day_of_year_flg_new\n    -- , f.functional_lvl_all_array\n    -- , f.array_lvl1_functional_unit_nm\n    -- , f.array_lvl2_functional_unit_nm\n    -- , f.array_lvl3_functional_unit_nm\n    -- , f.array_functional_unit_rk\n    -- , et.avg_headcount\n    -- , et.avg_headcount_active\n\n        -- Нормализуем дату: если это перевод и последний день месяца, переносим на 1-е следующего месяца\n    , CASE \n        WHEN (mt.is_transfer_out_management_flg = 1 or lt.is_transfer_out_legal_flg = 1 or ht.is_transfer_out_emp_flg = 1)\n             AND e.last_day_of_month_flg = 1\n        THEN (date_trunc('month', e.business_dt) + interval '1 month')::date\n        ELSE e.business_dt\n    END as business_dt_new_transfer\n\nfrom pre_join_employee e\n\nleft join management_transfer mt\n    on e.business_dt=mt.change_dt\n    and e.mdm_employee_rk=mt.mdm_employee_rk\n\nleft join legal_transfer lt\n    on e.business_dt=lt.change_dt\n    and e.mdm_employee_rk=lt.mdm_employee_rk\n\nleft join mdm_emp_transfer ht\n    on e.business_dt=ht.business_dt\n    and e.mdm_employee_rk=ht.mdm_employee_rk\n\n-- left join mdm_other_transfer ot\n--     on e.business_dt=ot.business_dt\n--     and e.mdm_employee_rk=ot.mdm_employee_rk\n\n-- left join functional_array f\n--     on e.business_dt=f.business_dt\n--     and e.mdm_employee_rk=f.mdm_employee_rk\n\n-- left join employee_turnover et\n--     on e.business_dt=et.calendar_dt\n--     and e.mdm_employee_rk=et.mdm_employee_rk\n    \n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
  - sid: 019b12c0-c1c6-74b2-b0fe-f349c7b85a0a
    title: Добавляем КП
    shebang: gp
    code: |-
      /*  Оптимизация.
          Приходится делать left join к огромной таблице functional_array ~66 млн строк, при таком джойне возникают спиллы.
          Поэтому вначале находим через inner join пересекающиеся с основной таблицей строки, таких получается ~3.5 млн и материализуем их в pre_join
          Далее джойним этот уменьшеный объём данных через left join к основной таблице
          (Пробовал без материализации, через with - возникают спиллы, поэтому делаем оптимизацию в 2 этапа - материализация + join)
      */

      drop table if exists pre_join;
      create table pre_join as

      select
              f.mdm_employee_rk
            , f.business_dt
            , f.functional_lvl_all_array
            , f.array_lvl1_functional_unit_nm
            , f.array_lvl2_functional_unit_nm
            , f.array_lvl3_functional_unit_nm
            , f.array_functional_unit_rk
        from
          functional_array f
        inner join
          all_employee_add_flags_pre a on f.business_dt = a.business_dt and f.mdm_employee_rk = a.mdm_employee_rk

      distributed by (mdm_employee_rk, business_dt);

      -------------------------------------------------------------

      drop table if exists all_employee_add_flags;
      create table all_employee_add_flags as
      select
          e. *
        , f.functional_lvl_all_array
        , f.array_lvl1_functional_unit_nm
        , f.array_lvl2_functional_unit_nm
        , f.array_lvl3_functional_unit_nm
        , f.array_functional_unit_rk
      from
        all_employee_add_flags_pre e
      left join
        pre_join f on e.business_dt = f.business_dt and e.mdm_employee_rk = f.mdm_employee_rk

      distributed by (mdm_employee_rk, business_dt);
    isEnabled: true
  - sid: 019b12c0-c1c6-74d2-830b-4bd2d054749d
    title: Проверка на дубли
    shebang: gp
    code: "with pre as (\r\nselect \r\n    mdm_employee_rk\r\n    , business_dt\r\n    , count(*) as cnt\r\n    , case when count(*)>1\r\n    then 0\r\n    else 1\r\n    end as div\r\nfrom all_employee_add_flags\r\ngroup by 1,2\r\nhaving count(*) > 1\r\n)\r\nselect\r\n    1/div as quality_check\r\nfrom pre;\r\n"
    isEnabled: true
