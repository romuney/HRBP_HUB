    title: Дата перехода в руководителя
    shebang: gp
    code: "drop table if exists mdm_employee_change_management_head;\ncreate table mdm_employee_change_management_head as\n\n\nwith pre as (select mdm_employee_rk\n, change_dt\nfrom prod_v_sse_crossdata.management_position_attr_chng\nwhere change_to_management_head_flg = 1\n\nunion all\n\nselect mdm_employee_rk\n, business_dt\nfrom prod_v_emart.mdm_employee_structure_d\nwhere 1=1\n    and company_hire_flg=1\n    and management_head_flg=1),\n\npre2 as (select distinct on (mdm_employee_rk) mdm_employee_rk\n, change_dt as change_management_head_dt\nfrom pre\norder by mdm_employee_rk, change_dt desc)\n\nselect pre2.mdm_employee_rk\n, change_management_head_dt\nfrom pre2\n\ninner join prod_v_emart.mdm_employee_structure_d m \n    on pre2.mdm_employee_rk = m.mdm_employee_rk\n    and m.last_day_flg=1\n    and m.management_head_flg=1\n"
    isEnabled: true
  - sid: 019b12c0-c1c6-75ae-822c-1ec1967d00ea
    title: Ограничиваем источник для детальных списков
    shebang: gp
    code: "drop table if exists mdm_employee_d_detail;\n\ncreate table mdm_employee_d_detail as\n\nselect e.*\n    , e.birth_dt::varchar(512) as birth_dt_text\n    , f.functional_lvl_all_array\n    , f.array_functional_unit_rk\n    -- , ed.education_degree_unique_max\n    -- , ed.education_spec_nm\n    , hs.head_lvl_segment\n    --, cg.change_grade_dt::varchar(512) as change_grade_dt_text\n    , coalesce(cg.change_grade_dt, e.company_hire_dt)::varchar(512) as change_grade_dt_text\n    , coalesce(cs.change_specialization_dt, e.company_hire_dt)::varchar(512) as change_specialization_dt_text\n    , coalesce(cmu.change_management_unit_dt, e.company_hire_dt)::varchar(512) as change_management_unit_dt_text\n    -- , coalesce(cmh.change_management_head_dt, e.company_hire_dt)::varchar(512) as change_management_head_dt\n    , cmh.change_management_head_dt::varchar(512) as change_management_head_dt\nfrom all_employee e\n\nleft join functional_array f\n    on e.business_dt=f.business_dt\n    and e.mdm_employee_rk=f.mdm_employee_rk\n\nleft join usr_cross_data.head_segments_versions hs\n    on e.mdm_employee_rk=hs.mdm_employee_rk\n    and hs.valid_to_dttm = '5999-01-01 00:00:00'\n\nleft join mdm_employee_change_grade cg\n    on e.mdm_employee_rk=cg.mdm_employee_rk\n\nleft join mdm_employee_change_specialization cs\n    on e.mdm_employee_rk=cs.mdm_employee_rk\n\nleft join mdm_employee_change_management_unit cmu\n    on e.mdm_employee_rk=cmu.mdm_employee_rk\n\nleft join mdm_employee_change_management_head cmh\n    on e.mdm_employee_rk=cmh.mdm_employee_rk\n    \nwhere 1=1\n    and e.business_dt >= (current_date - interval '1 day') - interval '3 month'\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
