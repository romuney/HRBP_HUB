    code: "drop table if exists legal_transfer;\n\ncreate table legal_transfer as\n\nselect lt.mdm_employee_rk\n    , lt.change_dt\n    , lt.change_from_lvl1_legal_flg as transfer_out_lvl1_legal_flg\n    , lt.change_from_lvl2_legal_flg as transfer_out_lvl2_legal_flg\n    , lt.change_from_lvl3_legal_flg as transfer_out_lvl3_legal_flg\n    , lt.change_from_lvl4_legal_flg as transfer_out_lvl4_legal_flg\n    , lt.change_from_lvl5_legal_flg as transfer_out_lvl5_legal_flg\n    , lt.change_from_lvl6_legal_flg as transfer_out_lvl6_legal_flg\n    , lt.change_from_lvl7_legal_flg as transfer_out_lvl7_legal_flg\n\n    , lt.change_to_lvl1_legal_unit_nm as next_lvl1_legal_unit_nm\n    , lt.change_to_lvl2_legal_unit_nm as next_lvl2_legal_unit_nm\n    , lt.change_to_lvl3_legal_unit_nm as next_lvl3_legal_unit_nm\n    , lt.change_to_lvl4_legal_unit_nm as next_lvl4_legal_unit_nm\n    , lt.change_to_lvl5_legal_unit_nm as next_lvl5_legal_unit_nm\n    , lt.change_to_lvl6_legal_unit_nm as next_lvl6_legal_unit_nm\n    , lt.change_to_lvl7_legal_unit_nm as next_lvl7_legal_unit_nm\n\n    , lt.change_to_lvl1_legal_flg as transfer_to_lvl1_legal_flg\n    , lt.change_to_lvl2_legal_flg as transfer_to_lvl2_legal_flg\n    , lt.change_to_lvl3_legal_flg as transfer_to_lvl3_legal_flg\n    , lt.change_to_lvl4_legal_flg as transfer_to_lvl4_legal_flg\n    , lt.change_to_lvl5_legal_flg as transfer_to_lvl5_legal_flg\n    , lt.change_to_lvl6_legal_flg as transfer_to_lvl6_legal_flg\n    , lt.change_to_lvl7_legal_flg as transfer_to_lvl7_legal_flg\n\n    , lt.change_from_lvl1_legal_unit_nm as prev_lvl1_legal_unit_nm\n    , lt.change_from_lvl2_legal_unit_nm as prev_lvl2_legal_unit_nm\n    , lt.change_from_lvl3_legal_unit_nm as prev_lvl3_legal_unit_nm\n    , lt.change_from_lvl4_legal_unit_nm as prev_lvl4_legal_unit_nm\n    , lt.change_from_lvl5_legal_unit_nm as prev_lvl5_legal_unit_nm\n    , lt.change_from_lvl6_legal_unit_nm as prev_lvl6_legal_unit_nm\n    , lt.change_from_lvl7_legal_unit_nm as prev_lvl7_legal_unit_nm\n    \n    -- , w.next_lvl1_legal_unit_nm\n    -- , w.next_lvl2_legal_unit_nm\n    -- , w.next_lvl3_legal_unit_nm\n    -- , w.next_employment_relation_type_desc\n    -- , w.next_employee_contract_type_desc\n\n    , lt.change_from_employment_relation_type_flg as transfer_out_employment_relation_type_flg\n    , lt.change_from_employee_contract_type_flg as transfer_out_employee_contract_type_flg\n\n    , lt.change_to_employment_relation_type_flg as transfer_to_employment_relation_type_flg \n    , lt.change_to_employee_contract_type_flg as transfer_to_employee_contract_type_flg\n\n    , lt.change_from_legal_position_flg as transfer_out_legal_position_flg\n    , lt.change_to_legal_position_flg as transfer_to_legal_position_flg \n\n    , lt.change_to_employment_relation_type_desc as next_employment_relation_type_desc\n    , lt.change_to_employee_contract_type_desc as next_employee_contract_type_desc\n    , lt.change_to_legal_position_nm as next_legal_position_nm\n\n    , lt.change_from_employment_relation_type_desc as prev_employment_relation_type_desc\n    , lt.change_from_employee_contract_type_desc as prev_employee_contract_type_desc\n    , lt.change_from_legal_position_nm as prev_legal_position_nm\n\n    , CASE \n            WHEN lt.change_from_lvl1_legal_flg = 1 \n              OR lt.change_from_lvl2_legal_flg = 1 \n              OR lt.change_from_lvl3_legal_flg = 1 \n              OR lt.change_from_lvl4_legal_flg = 1 \n              OR lt.change_from_lvl5_legal_flg = 1 \n              OR lt.change_from_lvl6_legal_flg = 1 \n              OR lt.change_from_lvl7_legal_flg = 1 \n              OR lt.change_from_employment_relation_type_flg = 1 \n              OR lt.change_from_employee_contract_type_flg = 1 \n              OR lt.change_from_legal_position_flg = 1\n            THEN 1\n            ELSE 0\n        END as is_transfer_out_legal_flg\n\nfrom prod_v_sse_crossdata.legal_position_attr_chng lt\n\nwhere 1=1\n    and lt.change_dt >= date_trunc('year', current_date - interval '1 day') - interval '3 year'\n\ndistributed by (mdm_employee_rk, change_dt)\n;\n\n"
