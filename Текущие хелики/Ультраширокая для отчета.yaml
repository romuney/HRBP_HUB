  - sid: 019b12c0-c1c6-758c-ba38-42fa30fc9327
    title: Данные по образованию
    shebang: gp
    code: "drop table if exists mdm_employee_education;\ncreate table mdm_employee_education as\n\nwith pre as (\n    select mdm_employee_rk\n, okso\n, education_level_nm\n, e.graduation_year\n, e.education_spec_nm\n, case \n          when education_level_nm ilike '%Докторантура%' then 'Докторантура'\n          when education_level_nm ilike '%Аспирантура%' then 'Аспирантура'\n          when education_level_nm ilike '%Ординатура%' then 'Ординатура'\n          when education_level_nm ilike '%Адъюнктура%' then 'Адъюнктура'\n          when education_level_nm ilike '%Магистратура%' then 'Магистратура'\n          when education_level_nm ilike '%Специалитет%' then 'Специалитет'\n          when education_level_nm ilike '%Бакалав%' then 'Бакалавриат'\n          when education_level_nm ilike '%Высшее образование%' and  not\n          \n          (education_level_nm ilike '%неоконченное высшее%' \n          or \n          education_level_nm ilike '%неполное высшее%'\n          )\n           then 'Высшее образование'\n          when education_level_nm ilike '%Подготовка кадров высшей категории%' then 'Подготовка кадров высшей категории'\n          when \n                education_level_nm ilike '%неоконченное высшее%'\n                or education_level_nm ilike '%Неполное высшее%'\n                \n          /* and not education_level_nm ilike '%Высшее образование%' */ then 'Неполное высшее образование'\n          when education_level_nm ilike '%профессионал%' then 'Среднее профессиональное'\n          when education_level_nm ilike '%Студент%' then 'Студент'\n          when education_level_nm ilike '%11 класс%' then 'Среднее общее образование (11 класс)'\n          when education_level_nm ilike '%9 класс%' then 'Среднее общее образование (9 класс)'\n          when education_level_nm ilike '%в академическом отпуске%' then 'В академическом отпуске'\n          when education_level_nm ilike '%Послевузовское образование%' then 'Повышение квалификации'\n          else education_level_nm\n     end as education_degree_unique_max\n, row_number() over (partition by mdm_employee_rk order by graduation_year desc /* Год выпуска*/) as rn_education\nfrom prod_v_hrmart.mdm_employee_education e\nwhere 1=1\n    and e.deleted_flg = 0\n    and e.valid_to_dttm = '5999-01-01')\n\nselect *\nfrom pre\nwhere 1=1\n    and rn_education=1\n"
    isEnabled: false
