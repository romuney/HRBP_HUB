  - sid: 019b12c0-c1c6-737e-8260-3855ab50c1de
    title: Собираем облегченную версию без переводов
    shebang: gp
    code: "drop table if exists all_employee_add_flags_light;\n\ncreate table all_employee_add_flags_light as\n\nselect e.*\n                    \n    , case  when last_day_flg=1 then 1 else last_day_of_month_flg end as last_day_of_month_flg_new\n    , case  when last_day_flg=1 then 1 else last_day_of_quarter_flg end as last_day_of_quarter_flg_new\n    , case  when last_day_flg=1 then 1 else last_day_of_year_flg end as last_day_of_year_flg_new\n    , f.functional_lvl_all_array\n    , f.array_lvl1_functional_unit_nm\n    , f.array_lvl2_functional_unit_nm\n    , f.array_lvl3_functional_unit_nm\n    , f.array_functional_unit_rk\n    --, wf.functional_unit_rk_array_new\n\nfrom all_employee e\n\nleft join functional_array f\n    on e.business_dt=f.business_dt\n    and e.mdm_employee_rk=f.mdm_employee_rk\n\n-- left join warden_functional_array wf\n--     on e.business_dt=wf.business_dt\n--     and e.mdm_employee_rk=wf.mdm_employee_rk\n\nwhere 1=1\n    and \n    (\n    e.last_day_flg=1\n    or e.last_day_of_month_flg=1\n    or e.company_hire_flg=1\n    or e.company_fire_flg=1\n    or e.transfer_candidate_flg=1\n    or e.transfer_internal_flg=1\n    )\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
