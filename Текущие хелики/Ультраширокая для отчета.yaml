  - sid: 019b12c0-c1c6-7392-bfb7-eed15686937e
    title: События переводов по атрибутам сотрудника
    shebang: gp
    code: "drop table if exists mdm_emp_transfer;\n\ncreate table mdm_emp_transfer as\n\nselect ht.mdm_employee_rk\n    , ht.business_dt\n    , ht.change_from_office_flg as transfer_out_office_flg\n    , ht.change_from_residential_state_flg as transfer_out_residential_state_flg\n    , ht.change_from_active_type_flg as transfer_out_active_type_flg\n    , ht.change_from_legal_employee_flg as transfer_out_legal_employee_flg\n    , ht.change_from_experience_group_nm_flg as transfer_out_experience_group_flg\n    , ht.change_from_experience_detail_group_nm_flg as transfer_out_experience_detail_group_flg\n    , ht.change_from_gender_desc_flg as transfer_out_gender_desc_flg\n    \n    , ht.change_from_active_type_nm as prev_active_type_nm\n    , ht.change_from_legal_employee_flg as prev_legal_employee_flg\n    , ht.change_from_experience_group_nm as prev_experience_group_nm\n    , ht.change_from_experience_detail_group_nm as prev_experience_detail_group_nm\n\n    , ht.change_to_active_type_nm as next_active_type_nm\n    , ht.change_to_legal_employee_flg as next_legal_employee_flg\n    , ht.change_to_experience_group_nm as next_experience_group_nm\n    , ht.change_to_experience_detail_group_nm as next_experience_detail_group_nm\n\n    , ht.change_to_office_flg as transfer_to_office_flg\n    , ht.change_to_residential_state_flg as transfer_to_residential_state_flg\n    , ht.change_to_active_type_flg as transfer_to_active_type_flg\n    , ht.change_to_legal_employee_flg as transfer_to_legal_employee_flg\n    , ht.change_to_experience_group_nm_flg as transfer_to_experience_group_flg\n    , ht.change_to_experience_detail_group_nm_flg as transfer_to_experience_detail_group_flg \n    , ht.change_to_gender_desc_flg as transfer_to_gender_desc_flg  \n\n    , ht.change_from_office_desc as prev_office_desc\n    , ht.change_from_residential_state_nm as prev_residential_state_nm\n    , ht.change_from_gender_desc as prev_gender_desc\n\n    , ht.change_to_office_desc as next_office_desc\n    , ht.change_to_residential_state_nm as next_residential_state_nm\n    , ht.change_to_gender_desc as next_gender_desc\n\n    , CASE \n            WHEN ht.change_from_office_flg = 1 \n              OR ht.change_from_residential_state_flg = 1 \n              OR ht.change_from_active_type_flg = 1 \n              OR ht.change_from_legal_employee_flg = 1 \n              OR ht.change_from_experience_group_nm_flg = 1 \n              OR ht.change_from_experience_detail_group_nm_flg = 1 \n              OR ht.change_from_gender_desc_flg = 1\n            THEN 1\n            ELSE 0\n        END as is_transfer_out_emp_flg\n\nfrom prod_v_sse_crossdata.mdm_employee_common_attr_change_d ht\n\nwhere 1=1\n    --and ht.change_dt >= date_trunc('year', current_date - interval '1 day') - interval '2 year'\n\ndistributed by (mdm_employee_rk, business_dt)\n;\n"
    isEnabled: true
  - sid: 019b12c0-c1c6-7399-8f7d-6a61bea1b9bf
    title: "Достаем даты, где есть переводы УС, ЮС"
    shebang: gp
    code: "drop table if exists employee_transfer_ms_ls;\ncreate table employee_transfer_ms_ls as\n\nselect e.business_dt\n, e.mdm_employee_rk\n\nfrom all_employee_new e\n\nleft join management_transfer mt\n    on e.business_dt=mt.change_dt\n    and e.mdm_employee_rk=mt.mdm_employee_rk\n\nleft join legal_transfer lt\n    on e.business_dt=lt.change_dt\n    and e.mdm_employee_rk=lt.mdm_employee_rk\n\nleft join mdm_emp_transfer ht\n    on e.business_dt=ht.business_dt\n    and e.mdm_employee_rk=ht.mdm_employee_rk\n\n-- left join mdm_other_transfer ot\n--     on e.business_dt=ot.business_dt\n--     and e.mdm_employee_rk=ot.mdm_employee_rk\n\n-- left join employee_turnover et\n--     on e.business_dt=et.calendar_dt\n--     and e.mdm_employee_rk=et.mdm_employee_rk\n\nwhere 1=1\n    and \n    (\n    e.last_day_flg=1\n    or e.last_day_of_month_flg=1\n    or e.company_hire_flg=1\n    or e.company_fire_flg=1\n    or e.transfer_candidate_flg=1\n    or e.transfer_internal_flg=1\n    or mt.mdm_employee_rk is not null\n    or lt.mdm_employee_rk is not null\n    or ht.mdm_employee_rk is not null\n    -- or ot.mdm_employee_rk is not null\n    )\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
  - sid: 019b12c0-c1c6-739d-a8fa-9b7560d026fe
    title: Уровень 1 КП - подготавливаем
    shebang: gp
    code: "drop table if exists pre_functional_lvl1;\n\ncreate table  pre_functional_lvl1 as \n\nselect f.mdm_employee_rk\n    , f.business_dt\n    , coalesce(trim(f.lvl1_functional_unit_nm),'-') as lvl1_functional_unit_nm\n    , coalesce(trim(f.lvl1_functional_unit_rk),'-') as lvl1_functional_unit_rk\n    , sum(coalesce(f.allocation_prt_norm,0)) as allocation_prt_norm\n\nfrom usr_cross_data.functional_role_d_br f \n\ninner join mdm_employee_d m\non f.business_dt = m.business_dt\nand f.mdm_employee_rk = m.mdm_employee_rk\n\nwhere 1=1\n    and f.business_dt >= date_trunc('year', current_date - interval '1 day') - interval '2 year'\n    and f.mdm_employee_rk is not null\n\ngroup by 1,2,3,4\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
