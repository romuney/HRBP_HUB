    code: "drop table if exists usr_cross_data.hr_executive_proteus;\ncreate table usr_cross_data.hr_executive_proteus as\n\nselect a.mdm_employee_rk\n    , a.mdm_employee_rk as fr_employee_rk\n    , a.business_dt as calendar_dt\n    , a.company_hire_dt as hire_dt\n    , a.company_fire_dt as fire_dt\n    , a.company_hire_flg as hire_flg\n    , a.company_fire_flg as fire_flg\n    , (a.work_experience_day_cnt/365.0)::numeric(23,3) as experience_year_amt\n    , a.experience_group_nm\n    , a.experience_detail_group_nm\n    , a.last_nm\n    , a.first_nm\n    , a.gender_desc as gender\n    , a.residential_state_nm\n    , a.city_nm \n    , a.doc_city_nm as city_doc\n    , a.legal_position_nm\n    , a.employment_relation_type_desc\n    , a.lvl1_legal_unit_rk\n    , a.lvl1_legal_unit_nm\n    , a.lvl2_legal_unit_rk\n    , a.lvl2_legal_unit_nm\n    , a.lvl3_legal_unit_rk\n    , a.lvl3_legal_unit_nm\n    , a.lvl4_legal_unit_rk\n    , a.lvl4_legal_unit_nm\n    , a.lvl5_legal_unit_rk\n    , a.lvl5_legal_unit_nm\n    , a.lvl6_legal_unit_rk\n    , a.lvl6_legal_unit_nm\n    , a.lvl7_legal_unit_rk\n    , a.lvl7_legal_unit_nm\n    , a.rus_tcr_flg\n    , a.foreign_tcr_flg\n    , a.tcr_flg\n    , a.employee_contract_type_desc\n    -- , e.pos_agent_flg\n    -- , e.management_position_rk\n    -- , e.management_position_id\n    , a.management_position_nm\n    , a.emp_stream_desc as employee_stream_desc\n    , a.emp_specialization_desc as employee_specialization_desc\n    , a.emp_specialization_oper_code\n    , a.emp_specialization_it_code\n    , a.emp_specialization_dk\n    , a.emp_stream_dk\n    , a.transfer_out_it_flg as emp_specialization_change_to_it\n    , a.transfer_to_it_flg as emp_specialization_change_to_non_it\n    , a.next_emp_specialization_it_code\n    , a.prev_emp_specialization_it_code\n    , a.management_head_flg\n    , a.management_unit_nm\n    , a.management_unit_rk\n    , a.lvl1_management_unit_rk as lvl1_mngt_unit_rk\n    , a.lvl1_management_unit_nm as lvl1_mngt_unit_nm\n    , a.lvl2_management_unit_rk as lvl2_mngt_unit_rk\n    , a.lvl2_management_unit_nm as lvl2_mngt_unit_nm\n    , a.lvl3_management_unit_rk as lvl3_mngt_unit_rk\n    , a.lvl3_management_unit_nm as lvl3_mngt_unit_nm\n    , a.lvl4_management_unit_rk as lvl4_mngt_unit_rk\n    , a.lvl4_management_unit_nm as lvl4_mngt_unit_nm\n    , a.lvl5_management_unit_rk as lvl5_mngt_unit_rk\n    , a.lvl5_management_unit_nm as lvl5_mngt_unit_nm\n    , a.lvl6_management_unit_rk as lvl6_mngt_unit_rk\n    , a.lvl6_management_unit_nm as lvl6_mngt_unit_nm\n    , a.lvl7_management_unit_rk as lvl7_mngt_unit_rk\n    , a.lvl7_management_unit_nm as lvl7_mngt_unit_nm\n    , a.lvl8_management_unit_rk as lvl8_mngt_unit_rk\n    , a.lvl8_management_unit_nm as lvl8_mngt_unit_nm\n    , a.lvl9_management_unit_rk as lvl9_mngt_unit_rk\n    , a.lvl9_management_unit_nm as lvl9_mngt_unit_nm\n    , a.lvl10_management_unit_rk as lvl10_mngt_unit_rk\n    , a.lvl10_management_unit_nm as lvl10_mngt_unit_nm\n    , a.lvl11_management_unit_rk as lvl11_mngt_unit_rk\n    , a.lvl11_management_unit_nm as lvl11_mngt_unit_nm\n    , a.lvl12_management_unit_rk as lvl12_mngt_unit_rk\n    , a.lvl12_management_unit_nm as lvl12_mngt_unit_nm\n    , a.active_type_nm\n    , a.active_employee_flg as active_count_flg\n    , a.legal_employee_flg\n    , case when a.prev_active_type_nm='Активная' then 1 else 0 end::smallint as prev_active_count_flg\n    , case when a.active_type_nm='Стажеры' then 1 else 0 end::smallint as internal_flg\n    , case when a.active_type_nm='Декрет' then 1 else 0 end::smallint as maternity_flg\n    , case when a.active_type_nm='Прогульщики' then 1 else 0 end::smallint as absent_flg\n    --, a.avg_headcount as monthly_avg_running_num_of_emp\n    , a.fire_reason\n    , a.fire_reason_group\n    , a.fire_initiative\n    , a.lose_talent_txt as lose_talent\n    , a.head_exit_company_info\n    , a.mapping_channel_name as source_type_nm\n    , a.respond_source_nm\n    , case when a.recruitmenttype='HQ' then 1 else 0 end::smallint as rayisa_hire_flg\n    , a.seniority\n    , a.grade\n    , a.regrettable_fire_flg\n    , a.potential_regrettable_flg\n    , a.potential_non_regrettable_flg\n    , a.non_regrettable_fire_flg\n\n    , a.transfer_out_lvl3_management_flg as lvl3_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl3_management_flg as lvl3_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl4_management_flg as lvl4_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl4_management_flg as lvl4_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl5_management_flg as lvl5_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl5_management_flg as lvl5_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl6_management_flg as lvl6_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl6_management_flg as lvl6_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl7_management_flg as lvl7_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl7_management_flg as lvl7_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl8_management_flg as lvl8_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl8_management_flg as lvl8_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl9_management_flg as lvl9_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl9_management_flg as lvl9_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl10_management_flg as lvl10_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl10_management_flg as lvl10_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl11_management_flg as lvl11_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl11_management_flg as lvl11_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl12_management_flg as lvl12_mngt_unit_out_trsf_flg\n    , a.transfer_to_lvl12_management_flg as lvl12_mngt_unit_in_trsf_flg\n    , a.transfer_out_lvl1_legal_flg as lvl1_legal_unit_out_trsf_flg\n    , a.transfer_to_lvl1_legal_flg as lvl1_legal_unit_in_trsf_flg\n    , a.last_day_of_month_flg_new as last_day_of_month_flg\n    --, rm.retention_month as monthly_retention\n    , ((a.business_dt - a.birth_dt)::numeric(23,0) / 365.0)::numeric(23,0) as age\n    , '-'::varchar(2) as fin_source_code\n    , '-'::varchar(2) as job_group_nm\n    , '-'::varchar(2) as lvl1_mngt_unit_out_trsf_flg\n    , '-'::varchar(2) as lvl1_mngt_unit_in_trsf_flg\n    , '-'::varchar(2) as lvl2_mngt_unit_out_trsf_flg\n    , '-'::varchar(2) as lvl2_mngt_unit_in_trsf_flg\n    , '-'::varchar(2) as legal_unit_id\n    , '-'::varchar(2) as management_unit_id\n    , a.type_create_company\n    , a.rb_flg\n    , a.rb_migration_flg\n    , a.transfer_to_active_type_flg\n    , a.transfer_out_active_type_flg\n    , a.transfer_candidate_flg\n    , a.transfer_internal_flg\n    , a.mdm_employee_age\n    , a.transfer_out_hq_flg\n    , a.transfer_out_it_flg\n    , a.transfer_out_specialization_flg\n    , a.transfer_out_stream_flg\n    , a.transfer_out_employment_relation_type_flg\n    , a.transfer_to_hq_flg\n    , a.transfer_to_it_flg\n    , a.transfer_to_specialization_flg\n    , a.transfer_to_stream_flg\n    , a.transfer_to_employment_relation_type_flg\n    , case when a.employment_relation_type_desc = 'Штатный сотрудник' THEN 'Штат' ELSE 'Не штат' END as staff_flg\n    , case\n        when rus_tcr_flg = 1 then  'ТЦР РФ'\n        when foreign_tcr_flg = 1 then  'ТЦР СНГ'\n        when lvl1_legal_unit_rk = '213f29bf7de4576e6d1682ae8132a400' then 'Банк'\n      else 'Другие юр. лица' end as  type_company\n    --, case when employee_contract_type_desc in  ('Временно дистанционный', 'Дистанционный') then 'Удаленный тип' else 'Офис' end as type_of_work\n    , employee_contract_type_desc as type_of_work\n    , a.transfer_out_legal_position_flg\n    , a.transfer_to_legal_position_flg\n    , a.active_hire_dt \n    , a.probation_flg\n    , a.hr_dismissal_comment_txt as fire_dismissal_comment_txt\n    , a.employee_dismissal_reason_desc\n    , a.t_education_desc\n    , a.summary_score\n    , a.office_desc\n    , case \n        when mdm_employee_age < 25 then 'до 25'\n        when mdm_employee_age >= 25 and mdm_employee_age < 30 then 'от 25 до 30'\n        when  mdm_employee_age >= 30  then '30+' end::varchar(512) as type_age\n    , a.transfer_to_lvl1_legal_flg\n, a.transfer_to_lvl3_legal_flg\n\n, a.transfer_out_lvl1_legal_flg\n, a.transfer_out_lvl3_legal_flg \n\n, a.lvl1_mapped_management_unit_rk  \n, a.lvl2_mapped_management_unit_rk  \n, a.lvl3_mapped_management_unit_rk  \n, a.lvl4_mapped_management_unit_rk  \n, a.lvl5_mapped_management_unit_rk \n, a.lvl6_mapped_management_unit_rk \n, a.lvl7_mapped_management_unit_rk \n, a.lvl8_mapped_management_unit_rk \n, a.lvl9_mapped_management_unit_rk \n, a.lvl10_mapped_management_unit_rk \n, a.lvl11_mapped_management_unit_rk \n, a.lvl12_mapped_management_unit_rk \n\n, a.lvl1_mapped_management_unit_nm\n, a.lvl2_mapped_management_unit_nm\n, a.lvl3_mapped_management_unit_nm\n, a.lvl4_mapped_management_unit_nm\n, a.lvl5_mapped_management_unit_nm\n, a.lvl6_mapped_management_unit_nm\n, a.lvl7_mapped_management_unit_nm\n, a.lvl8_mapped_management_unit_nm\n, a.lvl9_mapped_management_unit_nm\n, a.lvl10_mapped_management_unit_nm\n, a.lvl11_mapped_management_unit_nm\n, a.lvl12_mapped_management_unit_nm\n\nfrom all_employee_add_flags a\n\n\nwhere 1=1\n    and legal_employee_flg = 1\n  \ndistributed by (mdm_employee_rk, calendar_dt);\n\nselect public.tcs_harmonize_grants('usr_cross_data.hr_executive_proteus');"
