  - sid: 019b12c0-c1c6-743b-97b0-62e6db7a6b25
    title: Уровень 1 КП - считаем флаги переводов
    shebang: gp
    code: "drop table if exists pre_transfer_functional_lvl1;\n\ncreate table  pre_transfer_functional_lvl1 as \n\nselect f.*\n    ,case when max(f.business_dt) over (partition by f.mdm_employee_rk, f.lvl1_functional_unit_rk) = f.business_dt and f.business_dt != current_date - 1\n            then 1\n     when lead(f.business_dt) over  (partition by f.mdm_employee_rk, f.lvl1_functional_unit_rk order by f.business_dt) != f.business_dt + 1 \n       then 1\n        else 0\n        end as transfer_out_lvl1_fucntional_flg\n    , case \n        when min(f.business_dt) over (partition by f.mdm_employee_rk, f.lvl1_functional_unit_rk) = f.business_dt then 1\n        when lag(f.business_dt) over  (partition by f.mdm_employee_rk, f.lvl1_functional_unit_rk order by f.business_dt) != f.business_dt - 1 then 1\n        else 0\n        end as transfer_in_lvl1_fucntional_flg\n\nfrom pre_functional_lvl1 f \n\nwhere 1=1\n\ndistributed by (mdm_employee_rk, business_dt);"
    isEnabled: true
