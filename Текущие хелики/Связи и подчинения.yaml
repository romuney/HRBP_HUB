    title: Untitled 7
    shebang: gp
    code: "-- SELECT hrbp_mdm_employee_rk\n-- , hrbp_ad_login\n-- , root_unit_nm\n-- , root_unit_rk\n-- , count(distinct root_lvl)\n-- FROM tmp_hrbp_visible_units \n-- GROUP BY 1,2,3,4\n-- HAVING count(distinct root_lvl) > 1;\n\n-- Строк с NULL быть не должно\nSELECT COUNT(*) \nFROM tmp_hrbp_visible_units \nWHERE access_role = 'лид эйчар'\n  AND (root_unit_rk IS NULL OR visible_unit_rk IS NULL);\n\n-- Для юнитов lvl1 корень = сам юнит\nSELECT DISTINCT visible_unit_rk, visible_unit_nm, root_unit_rk, root_unit_nm, root_lvl, unit_level\nFROM tmp_hrbp_visible_units\nWHERE access_role = 'лид эйчар'\n  AND visible_unit_lvl = 1;\n\n-- Для юнитов lvl2 корень = они сами (т.к. tmp_unit_lvl2_root для lvl2 юнита выдаст его же)\nSELECT DISTINCT visible_unit_rk, root_unit_rk\nFROM tmp_hrbp_visible_units\nWHERE access_role = 'лид эйчар'\n  AND visible_unit_lvl = 2\nLIMIT 5;\n\n-- select * FROM tmp_hrbp_visible_units;\n\n--SELECT * FROM tmp_hrbp_viewers;"
