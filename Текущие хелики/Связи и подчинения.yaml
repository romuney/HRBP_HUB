title: Связи и подчинения
paragraphs:
  - sid: 019f8a78-0e0c-7822-a332-0db9bf6fada3
    title: Параграф 1. Справочник уровней юнитов
    shebang: gp
    code: |-
      DROP TABLE IF EXISTS tmp_unit_dict;
      CREATE TABLE tmp_unit_dict AS
      SELECT DISTINCT
          management_unit_rk           AS unit_rk,
          mapped_management_unit_nm    AS unit_nm,
          management_unit_lvl_num::int AS unit_lvl_num    -- приведение к int
      FROM prod_v_emart.mdm_employee_structure_d
      WHERE 1=1
          AND last_day_flg = 1
      DISTRIBUTED BY (unit_rk);
      ANALYZE tmp_unit_dict;
    isEnabled: true
  - sid: 019f8a7f-49b1-7096-8246-059d1f4f98f1
