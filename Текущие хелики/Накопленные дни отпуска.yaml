title: Накопленные дни отпуска
paragraphs:
  - sid: 019ddd53-51f6-7580-92ba-9b490ce44f1e
    title: Актуальность
    shebang: python_condition
    code: |-
      import tinkoff as tf
      tf.actuality.tables_wait([
          'prod_v_hrmart.legal_position_accum_vacation'
          , 'prod_v_chrono_peoplehub_employee_status.vacations_employee_status'
          , 'prod_v_dds.employee_main'
          , 'prod_v_emart.mdm_employee_structure_d'
          , 'usr_cross_data.unused_vacation'
          , 'prod_v_hrmart.mdm_employee_structure_list_d'
      ], gp_service='cross')
    isEnabled: true
  - sid: 019be531-52b7-7bb0-8864-0eff964724db
    title: Запланированные отпуска в этом году
    shebang: gp
    code: |-
      drop table if exists plan_vacation;
      create table plan_vacation as

      select mdm_employee_rk
      , sum(vacation_day_cnt) as plan_vacation
      from prod_v_hrmart.statement_vacation
      where 1=1
          and start_vacation_dt > current_date
          and start_vacation_dt <= (date_trunc('year',current_date) + interval '1 year' - interval '1 day')
          --and end_vacation_dt >= date_trunc('year',current_date)
      group by 1
    isEnabled: true
